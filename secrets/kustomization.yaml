# Runbook 8.2: SOPS/age-verschluesselte Secrets, von Flux (mentolder-secrets) angewendet.
# Nicht enthalten: flux-system/sops-age (Entschluesselungsschluessel, vorab per Hand),
# cert-manager/letsencrypt-prod-key (gehoert cert-manager) und Secrets aus dem Render.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cert-manager/ipv64-api-key.sops.yaml
  - coturn/coturn-secrets.sops.yaml
  - flux-system/flux-webhook-token.sops.yaml
  - flux-system/gekko-mentolder-git-verify.sops.yaml
  - monitoring/grafana-oidc.sops.yaml
  - monitoring/monitoring-admission.sops.yaml
  - monitoring/otel-collector-auth.sops.yaml
  - rustdesk/rustdesk-secrets.sops.yaml
  - website/ghcr-pull-secret.sops.yaml
  - website/website-content-token.sops.yaml
  - website/website-mailkey.sops.yaml
  - website/website-secrets.sops.yaml
  - workspace-office/collabora-secrets.sops.yaml
  - workspace-office/ghcr-pull-secret.sops.yaml
  - workspace/fuehrungsfunk.sops.yaml
  - workspace/ghcr-pull-secret.sops.yaml
  - workspace/ipv64-api-key.sops.yaml
  - workspace/knowledge-secrets.sops.yaml
  - workspace/ntfy-tokens.sops.yaml
  - workspace/workspace-secrets.sops.yaml
