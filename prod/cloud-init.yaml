#cloud-config
# Usage: paste as Hetzner server "User data" when creating a NEW gekko node
#        that will initialise the fleet k3s cluster (cluster-init: true).
# fleet auf gekko (T016529, D1/D2): 3 Server mit embedded etcd, Knotenverkehr
# ueber das private Netz (192.168.200.x), Admin ueber Tailscale (tag:fleet).
# Vor dem Provisionieren ersetzen: REPLACEME_NODE_NAME, REPLACEME_NODE_IP
# (privat), REPLACEME_NODE_PUBLIC_IP, REPLACEME_PRIVATE_IFACE,
# REPLACEME_TAILNET_NAME, REPLACEME_TAILNET_IP, REPLACEME_TAILSCALE_AUTH_KEY.
# For joining an existing cluster use prod/cloud-init-join-cp.yaml (control-plane)
# or prod/cloud-init-worker.yaml (agent/worker).
# See .claude/skills/hetzner-node/SKILL.md for the full provisioning runbook.
users:
  - default
  - name: patrick
    groups: sudo
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFN75CnuOz7YXaJipTFxWMVDgm35heu64JKN1QL+Z84+ patrick@korczewski.de
  - name: gekko
    groups: sudo
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH43aUqN4w9u7DIt3gUREOJY4pmVIWvIbqFsG/fPSlV0 gekko@mentolder-20260513

ssh_pwauth: false

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - htop
  - unattended-upgrades
  - apt-transport-https
  - nfs-common
  - jq
  - fail2ban
  - ufw

write_files:
  # Tailscale-Auth-Key (tagged key, tag:fleet; Key-Ablauf in der
  # Tailscale-Admin-Konsole deaktiviert, D1).
  - path: /etc/tailscale/auth-key
    permissions: '0600'
    owner: root:root
    content: REPLACEME_TAILSCALE_AUTH_KEY

  - path: /etc/rancher/k3s/config.yaml
    content: |
      node-name: "REPLACEME_NODE_NAME"
      node-ip: "REPLACEME_NODE_IP"
      tls-san:
        - ${PROD_DOMAIN}
        - "*.${PROD_DOMAIN}"
        - REPLACEME_NODE_IP
        - REPLACEME_NODE_PUBLIC_IP
        - REPLACEME_TAILNET_NAME
        - REPLACEME_TAILNET_IP
      disable:
        - traefik
        - servicelb
      kubelet-arg:
        - "max-pods=110"
      kube-apiserver-arg:
        - "default-not-ready-toleration-seconds=30"
        - "default-unreachable-toleration-seconds=30"
      write-kubeconfig-mode: "0644"
      cluster-init: true
      secrets-encryption: true
      flannel-iface: REPLACEME_PRIVATE_IFACE

  - path: /etc/sysctl.d/99-k3s.conf
    content: |
      net.core.somaxconn=32768
      net.ipv4.ip_forward=1
      net.bridge.bridge-nf-call-iptables=1
      net.ipv4.conf.all.forwarding=1
      fs.inotify.max_user_watches=524288
      fs.inotify.max_user_instances=512
      vm.max_map_count=262144

  - path: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = 22
      maxretry = 5
      bantime = 3600
      findtime = 600

  - path: /etc/ssh/sshd_config.d/hardened.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers patrick gekko

runcmd:
  - sysctl --system

  # Firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 6443/tcp
  - ufw allow 10250/tcp
  - ufw allow 8472/udp
  - ufw allow 3478/tcp     # coturn TURN/STUN (TCP)
  - ufw allow 3478/udp     # coturn TURN/STUN (UDP)
  - ufw allow 5349/tcp     # coturn TURNS (TLS TURN — iOS/iPhone)
  - ufw allow 49152:49252/udp  # coturn TURN relay port range
  - ufw allow 20000:20200/udp  # Janus SFU RTP media (Talk HPB; required for >3-participant calls)
  - ufw allow 21115/tcp     # RustDesk hbbs NAT-type test
  - ufw allow 21116/tcp     # RustDesk hbbs ID registration / TCP hole punching
  - ufw allow 21116/udp     # RustDesk hbbs ID registration / heartbeat (UDP)
  - ufw allow 21117/tcp     # RustDesk hbbr relay
  - ufw allow from 192.168.200.0/24 to any port 21118,21119 proto tcp  # RustDesk web-client (hbbs/hbbr WS) — privates Netz only, never public
  - ufw allow 2379:2380/tcp
  # ── dev.mentolder.de — sish SSH (2222/tcp) ─────────────────────────
  # Deny-by-default. Explicit allow rules are applied per-CIDR from
  # DEV_SSH_ALLOWLIST by `task dev:firewall:open` (Taskfile.dev-stack.yml)
  # — they're runtime state, not cloud-init.
  - ufw deny 2222/tcp comment "sish - default deny"
  - ufw --force enable

  # Services
  - systemctl enable fail2ban
  - systemctl start fail2ban
  - systemctl restart ssh
  - systemctl enable unattended-upgrades
  - systemctl start unattended-upgrades

  # Tailscale (Admin/kubectl, tag:fleet) — vor k3s, damit die Tailnet-SANs
  # beim Zertifikats-Bootstrap schon aufloesbar sind.
  - curl -fsSL https://tailscale.com/install.sh | sh
  - tailscale up --auth-key="file:/etc/tailscale/auth-key" --hostname="REPLACEME_NODE_NAME" --advertise-tags=tag:fleet --ssh --accept-routes=false

  # Install k3s
  - curl -sfL https://get.k3s.io | INSTALL_K3S_CHANNEL=stable sh -
  - until kubectl get nodes; do sleep 2; done

  # Kubeconfig for patrick
  - mkdir -p /home/patrick/.kube
  - cp /etc/rancher/k3s/k3s.yaml /home/patrick/.kube/config
  - sed -i "s/127.0.0.1/$(curl -s http://169.254.169.254/hetzner/v1/metadata/public-ipv4)/g" /home/patrick/.kube/config
  - chown -R patrick:patrick /home/patrick/.kube

  # Install Helm
  - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

  # Install task
  - sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

  # Dev toolchain for the gekko-hetzner-2 dev box.
  # The script is hostname-guarded and is a no-op on every other node,
  # so it is safe to leave this in the shared cloud-init template.
  - curl -fsSL https://raw.githubusercontent.com/Paddione/Bachelorprojekt/main/scripts/install-dev-tools.sh -o /usr/local/sbin/install-dev-tools.sh
  - chmod +x /usr/local/sbin/install-dev-tools.sh
  - DEV_USER=gekko /usr/local/sbin/install-dev-tools.sh || true

  # Install Traefik via Helm
  - su - patrick -c "helm repo add traefik https://traefik.github.io/charts"
  - su - patrick -c "helm repo update"
  # Values file (DaemonSet on the 3 public nodes, hostPort 80/443 + ClusterIP
  # service type — no ServiceLB hop — for real client IPs, see T001341) lives
  # in the repo so it's testable and shared with the manual live-upgrade
  # runbook; fetched the same way install-dev-tools.sh is above.
  # The Traefik chart creates an IngressClass named "traefik" by default;
  # we deliberately do NOT pass providers.kubernetesingress.ingressClass=traefik
  # because the live mentolder install does not have that arg either, and
  # adding it would force a chart upgrade just to match the docs.
  - su - patrick -c "curl -fsSL https://raw.githubusercontent.com/Paddione/Bachelorprojekt/main/prod/traefik-values.yaml -o /home/patrick/traefik-values.yaml"
  - su - patrick -c "KUBECONFIG=/home/patrick/.kube/config helm install traefik traefik/traefik -n kube-system -f /home/patrick/traefik-values.yaml"

final_message: "k3s control plane ready on $(hostname) - $(date)"
