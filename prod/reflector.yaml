# Weekly CronJob that copies cluster-wide secrets into the service namespaces
# that need them: the wildcard TLS cert and the ghcr-pull-secret.
# Uses the K8s API via curl + ServiceAccount token - no kubectl image needed.
#
# Weekly (was monthly) since T900036: the TLS part only has to beat Let's
# Encrypt's 90-day lifetime, but a missing image-pull secret has to converge
# faster than that. ghcr-pull-secret had been absent from workspace-office and
# website-staging for so long that only the local image cache kept collabora
# and the staging website running (34355 + 98 FailedToRetrieveImagePullSecret
# events); the next pull would have failed.
#
# It used to be provisioned imperatively (task workspace:office:pull-secret /
# task website:pull-secret). Prod is pull-based via Flux, so those tasks never
# run there and every namespace nobody touched by hand drifted away. Syncing
# from a namespace that already holds the secret keeps it declarative without
# putting a GHCR_PAT into the repo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tls-sync
  namespace: ${WORKSPACE_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tls-sync
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tls-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tls-sync
subjects:
  - kind: ServiceAccount
    name: tls-sync
    namespace: ${WORKSPACE_NAMESPACE}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tls-sync
  namespace: ${WORKSPACE_NAMESPACE}
spec:
  schedule: "0 3 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: tls-sync
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  API=https://kubernetes.default.svc

                  sync_secret() {
                    SRC_NS="$1" SRC="$2" DST="$3" NS="$4"
                    CRT=$(curl -sf --cacert "$CA" -H "Authorization: Bearer $TOKEN" \
                      "$API/api/v1/namespaces/$SRC_NS/secrets/$SRC" \
                      | tr -d '\n' \
                      | grep -o '"tls\.crt": *"[^"]*"' \
                      | grep -o '"[^"]*"$' | tr -d '"')
                    [ -n "$CRT" ] || { echo "skip: $SRC_NS/$SRC not found"; return; }
                    KEY=$(curl -sf --cacert "$CA" -H "Authorization: Bearer $TOKEN" \
                      "$API/api/v1/namespaces/$SRC_NS/secrets/$SRC" \
                      | tr -d '\n' \
                      | grep -o '"tls\.key": *"[^"]*"' \
                      | grep -o '"[^"]*"$' | tr -d '"')
                    BODY="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"$DST\"},\"type\":\"kubernetes.io/tls\",\"data\":{\"tls.crt\":\"$CRT\",\"tls.key\":\"$KEY\"}}"
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" --cacert "$CA" \
                      -H "Authorization: Bearer $TOKEN" \
                      "$API/api/v1/namespaces/$NS/secrets/$DST")
                    if [ "$STATUS" = "200" ]; then
                      curl -sf --cacert "$CA" -X PATCH \
                        -H "Authorization: Bearer $TOKEN" \
                        -H "Content-Type: application/strategic-merge-patch+json" \
                        "$API/api/v1/namespaces/$NS/secrets/$DST" \
                        -d "$BODY" > /dev/null
                    else
                      curl -sf --cacert "$CA" -X POST \
                        -H "Authorization: Bearer $TOKEN" \
                        -H "Content-Type: application/json" \
                        "$API/api/v1/namespaces/$NS/secrets" \
                        -d "$BODY" > /dev/null
                    fi
                    echo "synced $SRC_NS/$SRC -> $NS/$DST"
                  }

                  # Same shape as sync_secret, but for a docker-registry secret: one
                  # .dockerconfigjson field and type kubernetes.io/dockerconfigjson.
                  # sync_secret above reads tls.crt/tls.key and would copy an empty
                  # secret here. [T900036]
                  sync_dockerconfig() {
                    SRC_NS="$1" SRC="$2" NS="$3"
                    CFG=$(curl -sf --cacert "$CA" -H "Authorization: Bearer $TOKEN" \
                      "$API/api/v1/namespaces/$SRC_NS/secrets/$SRC" \
                      | tr -d '\n' \
                      | grep -o '"\.dockerconfigjson": *"[^"]*"' \
                      | grep -o '"[^"]*"$' | tr -d '"')
                    [ -n "$CFG" ] || { echo "skip: $SRC_NS/$SRC not found"; return; }
                    BODY="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"$SRC\"},\"type\":\"kubernetes.io/dockerconfigjson\",\"data\":{\".dockerconfigjson\":\"$CFG\"}}"
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" --cacert "$CA" \
                      -H "Authorization: Bearer $TOKEN" \
                      "$API/api/v1/namespaces/$NS/secrets/$SRC")
                    if [ "$STATUS" = "200" ]; then
                      curl -sf --cacert "$CA" -X PATCH \
                        -H "Authorization: Bearer $TOKEN" \
                        -H "Content-Type: application/strategic-merge-patch+json" \
                        "$API/api/v1/namespaces/$NS/secrets/$SRC" \
                        -d "$BODY" > /dev/null
                    else
                      curl -sf --cacert "$CA" -X POST \
                        -H "Authorization: Bearer $TOKEN" \
                        -H "Content-Type: application/json" \
                        "$API/api/v1/namespaces/$NS/secrets" \
                        -d "$BODY" > /dev/null
                    fi
                    echo "synced $SRC_NS/$SRC -> $NS/$SRC"
                  }
                  #
                  # Wildcard TLS cert into every service namespace.
                  # ${WORKSPACE_NAMESPACE}, ${WEBSITE_NAMESPACE} and ${TLS_SECRET_NAME}
                  # are substituted by envsubst during the render, so the correct values
                  # per env land here. Destinations that don't exist on a given cluster
                  # are skipped gracefully.
                  for NS in coturn workspace-office ${WEBSITE_NAMESPACE}; do
                    sync_secret ${WORKSPACE_NAMESPACE} ${TLS_SECRET_NAME} ${TLS_SECRET_NAME} "$NS" || \
                      echo "warn: tls sync to $NS failed or namespace absent - skipping"
                  done
                  #
                  # ghcr-pull-secret: coturn runs no GHCR image and is not a target. The
                  # source namespace holds the secret on every env (workspace /
                  # workspace-staging); the two destinations are exactly where the audit
                  # found it missing. [T900036]
                  for NS in workspace-office ${WEBSITE_NAMESPACE}; do
                    sync_dockerconfig ${WORKSPACE_NAMESPACE} ghcr-pull-secret "$NS" || \
                      echo "warn: ghcr-pull-secret sync to $NS failed or namespace absent - skipping"
                  done
              resources:
                requests:
                  memory: 16Mi
                  cpu: 10m
                limits:
                  memory: 32Mi
                  cpu: 50m
