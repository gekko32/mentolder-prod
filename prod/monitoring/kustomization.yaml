apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Prod-Monitoring auf gekko (T016529): schlankes kube-prometheus OHNE Loki
# (Operator-Entscheid), kurze Retention, local-path statt Longhorn (D3),
# Ressourcenlimits aufs gekko-RAM-Budget (R1). Die k3d-Basis bleibt
# unveraendert; Loki/Promtail werden hier per $patch: delete entfernt.

resources:
  - ../../k3d/monitoring
  - grafana-ingress.yaml
  - otel-ingressroute.yaml

patches:
  - target: { kind: Secret, name: alertmanager-pushover }
    patch: |
      apiVersion: v1
      kind: Secret
      metadata: { name: alertmanager-pushover }
      $patch: delete
  - target: { kind: Secret, name: alertmanager-smtp }
    patch: |
      apiVersion: v1
      kind: Secret
      metadata: { name: alertmanager-smtp }
      $patch: delete
  - target: { kind: Secret, name: grafana-oidc }
    patch: |
      apiVersion: v1
      kind: Secret
      metadata: { name: grafana-oidc }
      $patch: delete
  # T014536: The kube-prometheus-stack chart renders a `monitoring-grafana`
  # Secret with the hardcoded default credentials admin/admin (base64
  # YWRtaW4=). Prod overrides the password via the grafana-oidc SealedSecret
  # (GRAFANA_ADMIN_PASSWORD) and patches all sidecar/grafana env vars that
  # consumed the old secret — the Secret itself is dead credential material and
  # must not survive into the rendered fleet artifact.
  - target: { kind: Secret, name: monitoring-grafana, namespace: monitoring }
    patch: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: monitoring-grafana
        namespace: monitoring
      $patch: delete
  - target: { kind: IngressRoute, name: grafana }
    patch: |
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata: { name: grafana, namespace: monitoring }
      $patch: delete
  # Strip the dev otel placeholder Secret + plain-web IngressRoute. Prod provides
  # the otel-collector-auth Secret via SealedSecret and the TLS route via
  # otel-ingressroute.yaml.
  - target: { kind: Secret, name: otel-collector-auth }
    patch: |
      apiVersion: v1
      kind: Secret
      metadata: { name: otel-collector-auth, namespace: monitoring }
      $patch: delete
  - target: { kind: IngressRoute, name: otel-collector }
    patch: |
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata: { name: otel-collector, namespace: monitoring }
      $patch: delete
  - path: storage-class-patch.yaml
  - path: grafana-oidc-patch.yaml
  - path: resource-limits-patch.yaml
  - path: slim-monitoring-patch.yaml
  # T016533: Chart-92.x-Grafana-Test-Hooks (helm.sh/hook=test) nie nach Prod —
  # Flux-Dry-Run lehnt den Test-Pod ab (SA-Lookup), helm test laeuft nie.
  - target: { kind: ServiceAccount, name: monitoring-grafana-test, namespace: monitoring }
    patch: |
      apiVersion: v1
      kind: ServiceAccount
      metadata: { name: monitoring-grafana-test, namespace: monitoring }
      $patch: delete
  - target: { kind: ConfigMap, name: monitoring-grafana-test, namespace: monitoring }
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: monitoring-grafana-test, namespace: monitoring }
      $patch: delete
  - target: { kind: Pod, name: monitoring-grafana-test, namespace: monitoring }
    patch: |
      apiVersion: v1
      kind: Pod
      metadata: { name: monitoring-grafana-test, namespace: monitoring }
      $patch: delete
  # Ohne Loki (T016529): Loki-Stack und Promtail aus der k3d-Basis loeschen.
  - target: { kind: StatefulSet, name: loki, namespace: monitoring }
    patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: { name: loki, namespace: monitoring }
      $patch: delete
  - target: { kind: DaemonSet, name: promtail, namespace: monitoring }
    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata: { name: promtail, namespace: monitoring }
      $patch: delete
  - target: { kind: Service, name: loki, namespace: monitoring }
    patch: |
      apiVersion: v1
      kind: Service
      metadata: { name: loki, namespace: monitoring }
      $patch: delete
  - target: { kind: Service, name: loki-headless, namespace: monitoring }
    patch: |
      apiVersion: v1
      kind: Service
      metadata: { name: loki-headless, namespace: monitoring }
      $patch: delete
  - target: { kind: Service, name: loki-memberlist, namespace: monitoring }
    patch: |
      apiVersion: v1
      kind: Service
      metadata: { name: loki-memberlist, namespace: monitoring }
      $patch: delete
  - target: { kind: ConfigMap, name: loki, namespace: monitoring }
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: loki, namespace: monitoring }
      $patch: delete
  - target: { kind: ConfigMap, name: loki-runtime, namespace: monitoring }
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: loki-runtime, namespace: monitoring }
      $patch: delete
  - target: { kind: ConfigMap, name: loki-grafana-datasource, namespace: monitoring }
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: loki-grafana-datasource, namespace: monitoring }
      $patch: delete
  - target: { kind: ServiceAccount, name: loki, namespace: monitoring }
    patch: |
      apiVersion: v1
      kind: ServiceAccount
      metadata: { name: loki, namespace: monitoring }
      $patch: delete
  - target: { kind: ServiceAccount, name: promtail, namespace: monitoring }
    patch: |
      apiVersion: v1
      kind: ServiceAccount
      metadata: { name: promtail, namespace: monitoring }
      $patch: delete
  - target: { kind: Secret, name: promtail, namespace: monitoring }
    patch: |
      apiVersion: v1
      kind: Secret
      metadata: { name: promtail, namespace: monitoring }
      $patch: delete
  - target: { kind: ClusterRole, name: loki-clusterrole }
    patch: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: { name: loki-clusterrole }
      $patch: delete
  - target: { kind: ClusterRoleBinding, name: loki-clusterrolebinding }
    patch: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata: { name: loki-clusterrolebinding }
      $patch: delete
  - target: { kind: ClusterRole, name: promtail }
    patch: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: { name: promtail }
      $patch: delete
  - target: { kind: ClusterRoleBinding, name: promtail }
    patch: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata: { name: promtail }
      $patch: delete
