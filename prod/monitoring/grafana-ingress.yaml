apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-prod
  namespace: monitoring
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`grafana.${PROD_DOMAIN}`)
      kind: Rule
      services:
        - name: monitoring-grafana
          port: 80
  # 15.11.2026 (F12): ohne secretName. Das Wildcard-Geheimnis liegt nicht in monitoring;
  # Traefik waehlt das Zertifikat per SNI aus den geladenen Secrets (wie flux-webhook).
  tls: {}
