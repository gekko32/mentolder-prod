# Schlankes Monitoring fuer gekko (T016529, R1): kube-prometheus ohne Loki,
# kurze Retention, Ressourcen aufs RAM-Budget zugeschnitten (nur Prod plus
# Monitoring, ca. 7-8 GiB Pods gesamt). Prometheus-Daten 24h / max. 9 GiB,
# Alertmanager-Verlauf 24h statt 120h.
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: monitoring-prometheus
  namespace: monitoring
spec:
  retention: "24h"
  retentionSize: "9GB"
  # 768Mi/500m reichten nicht: 1090 OOMKills bis 28.10.2026, CPU dauerhaft am Limit.
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits: { cpu: "1", memory: 1536Mi }
---
apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: monitoring-alertmanager
  namespace: monitoring
spec:
  retention: "24h"
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }
