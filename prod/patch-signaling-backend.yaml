apiVersion: v1
kind: ConfigMap
metadata:
  name: signaling-config
data:
  server.conf.template: |
    [http]
    listen = 0.0.0.0:8080

    [app]
    debug = false

    [sessions]
    hashkey = @@SESSION_HASHKEY@@
    blockkey = @@SESSION_BLOCKKEY@@

    [clients]
    internalsecret = @@CLIENTS_INTERNALSECRET@@

    [backend]
    allowall = false
    backends = backend-1
    timeout = 10
    connectionsperhost = 8

    [backend-1]
    url = https://files.${PROD_DOMAIN}
    secret = @@SIGNALING_SECRET@@
    maxstreambitrate = 0
    maxscreenbitrate = 0

    [nats]
    url = nats://nats:4222

    [mcu]
    type = janus
    url = ws://janus.coturn:8188
    # 12.11.2026: Messung zeigte Bandbreitengrenze genau 1 Mbit/s, Chrome schaltete die HD-Stufe ab.
    # Erhöhen nur zusammen mit Janus-Neustart (talk-signaling-neustart.ps1 -MitJanus).
    # 12.11.2026 spät: 2 Mbit/s überforderte den Handy-Browser („ausgelastet“), daher 1,5 Mbit/s.
    maxstreambitrate = 1572864
    maxscreenbitrate = 4194304

    [turn]
    apikey = @@TURN_APIKEY@@
    secret = @@TURN_SECRET@@
    servers = turn:turn.${PROD_DOMAIN}:3478?transport=udp,turn:turn.${PROD_DOMAIN}:3478?transport=tcp,turns:turn.${PROD_DOMAIN}:5349?transport=tcp
