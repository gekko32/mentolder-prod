apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
spec:
  template:
    spec:
      containers:
        - name: vaultwarden
          env:
            - name: DOMAIN
              value: "https://vault.${PROD_DOMAIN}"
            - name: SSO_AUTHORITY
              value: "https://auth.${PROD_DOMAIN}"
            - name: SMTP_HOST
              value: "${SMTP_HOST}"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_SECURITY
              value: "starttls"
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: workspace-secrets
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workspace-secrets
                  key: SMTP_PASSWORD
            - name: SMTP_FROM_NAME
              value: "Vaultwarden"
            # Vaultwarden verweigert den Start, wenn SMTP_HOST gesetzt ist, aber
            # SMTP_FROM fehlt ("Both SMTP_HOST and SMTP_FROM need to be set for
            # email support without USE_SENDMAIL") - das hielt vault.mentolder.de
            # 3d in CrashLoopBackOff (942 Neustarts, HTTP 503). [T900028]
            - name: SMTP_FROM
              value: "${SMTP_FROM}"
