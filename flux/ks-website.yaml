apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mentolder-prod-website
  namespace: gekko-mentolder
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: flux-infra-controllers
      namespace: flux-system
  serviceAccountName: gekko-mentolder-deploy
  sourceRef:
    kind: OCIRepository
    name: mentolder-manifests
  path: ./website-mentolder
  prune: true
  wait: true
