apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mentolder-manifests
  namespace: gekko-mentolder
spec:
  interval: 10m
  url: oci://ghcr.io/gekko32/mentolder-manifests
  ref:
    tag: latest
  # Das Paket ghcr.io/gekko32/mentolder-manifests ist oeffentlich, kein Lesegeheimnis noetig.
  # Nur Artefakte, die dieser Workflow signiert hat (keyless cosign, GitHub OIDC).
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/gekko32/mentolder-prod/\.github/workflows/render\.yml@refs/heads/main$
