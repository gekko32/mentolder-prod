apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mentolder-manifests
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/gekko32/mentolder-manifests
  ref:
    tag: latest
  # Lesezugriff auf das (private) GHCR-Paket. Secret mit gekko32-Token (read:packages) im Cluster
  # anlegen, oder das Paket oeffentlich machen und secretRef entfernen.
  secretRef:
    name: gekko-ghcr-auth
  # Nur Artefakte, die dieser Workflow signiert hat (keyless cosign, GitHub OIDC).
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/gekko32/mentolder-prod/\.github/workflows/render\.yml@refs/heads/main$
