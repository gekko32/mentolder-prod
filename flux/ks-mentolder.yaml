apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mentolder-prod
  namespace: gekko-mentolder
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    # Cluster-Infrastruktur bleibt in Paddione/Bachelorprojekt.
    - name: flux-infra-controllers
      namespace: flux-system
    # Secrets VOR dem Brand-Stack reconcilen (Race bei neuem Secret-Key). Die SealedSecrets
    # gehoeren zum Cluster und bleiben in Paddione/Bachelorprojekt.
    - name: flux-sealed-secrets-mentolder
      namespace: flux-system
  serviceAccountName: gekko-mentolder-deploy
  sourceRef:
    kind: OCIRepository
    name: mentolder-manifests
  path: ./mentolder
  prune: true
  # Nur Workloads, die diese Kustomization selbst ausrollt (kein Gate auf fremde Infrastruktur).
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: shared-db
      namespace: workspace
    - apiVersion: apps/v1
      kind: Deployment
      name: pocket-id
      namespace: workspace
