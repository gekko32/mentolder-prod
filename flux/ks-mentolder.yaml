apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mentolder-prod
  namespace: gekko-mentolder
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    # Cluster-Infrastruktur bleibt in Paddione/Bachelorprojekt.
    - name: flux-infra-controllers
      namespace: flux-system
    # Secrets VOR dem Brand-Stack reconcilen (Race bei neuem Secret-Key). Die SealedSecrets
    # gehoeren zum Cluster und bleiben in Paddione/Bachelorprojekt.
    - name: flux-sealed-secrets-mentolder
      namespace: flux-system
  serviceAccountName: gekko-mentolder-deploy
  sourceRef:
    kind: OCIRepository
    name: mentolder-manifests
  path: ./mentolder
  prune: true
  # Nur Workloads, die diese Kustomization selbst ausrollt (kein Gate auf fremde Infrastruktur).
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: shared-db
      namespace: workspace
    - apiVersion: apps/v1
      kind: Deployment
      name: pocket-id
      namespace: workspace
  # Wartungsfenster Fresh-Cluster-Rebuild (Runbook Phase 4.2): Merge dieses Blocks
  # friert mentolder-Prod ein. Alle Deployments in workspace ausser shared-db
  # (bleibt fuer pg_dumpall) auf 0, alle CronJobs pausiert. Rueckbau: PR reverten.
  patches:
    - target:
        kind: Deployment
        namespace: workspace
        name: "^(brain|brett|downloads|einvoice-sidecar|fuehrungsfunk|mailpit|mentolder-web|nats|nextcloud|nextcloud-redis|ntfy|oauth2-proxy-brain|oauth2-proxy-brett|oauth2-proxy-downloads|oauth2-proxy-mailpit|oauth2-proxy-rustdesk-web|oauth2-proxy-session-hub|oauth2-proxy-studio|oauth2-proxy-traefik|pocket-id|sessions-server|spreed-signaling|studio-server|whiteboard)$"
      patch: |
        - op: add
          path: /spec/replicas
          value: 0
    - target:
        kind: CronJob
        namespace: workspace
      patch: |
        - op: add
          path: /spec/suspend
          value: true
