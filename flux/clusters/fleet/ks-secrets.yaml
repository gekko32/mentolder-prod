# Secrets SOPS-verschluesselt aus ./secrets (Git, signaturgeprueft). prune: false,
# damit ein versehentlich entfernter Eintrag kein laufendes Secret loescht.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mentolder-secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./secrets
  prune: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
