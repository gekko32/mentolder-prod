name: Mirror images from ghcr.io/paddione
# Runbook 3.2: spiegelt die Images aus images-mirror.txt nach ghcr.io/gekko32.
# crane copy erhaelt die Digests, gepinnte @sha256-Referenzen im Render bleiben gueltig.
#
# Schutz eigener Images:
# - brett, website, fuehrungsfunk sind eigene gekko32-Builds und werden nie beschrieben.
# - Ein bereits vorhandenes Ziel wird nur beschrieben, wenn es den Marker-Tag
#   mirror-from-paddione traegt (also selbst aus diesem Mirror stammt).
#
# Private Quellen (private=1, z. B. downloads-content) liest der Workflow mit dem
# Repo-Secret PADDIONE_GHCR_READ_TOKEN (Classic PAT nur read:packages, mit Ablauf).
# Ein Login gilt pro Registry-Host. Deshalb werden private Images erst lokal als
# OCI-Layout gezogen und danach mit GITHUB_TOKEN gepusht.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [images-mirror.txt, .github/workflows/mirror-images.yml]
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: mirror-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  SRC: ghcr.io/paddione
  DST: ghcr.io/gekko32
  MARKER: mirror-from-paddione
  PROTECTED: "brett website fuehrungsfunk"

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install crane
        run: |
          set -euo pipefail
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin crane

      - name: Mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PADDIONE_READ: ${{ secrets.PADDIONE_GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          login_dst() { printf '%s' "$GH_TOKEN" | crane auth login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin >/dev/null; }
          login_src() { printf '%s' "$PADDIONE_READ" | crane auth login ghcr.io -u paddione-read --password-stdin >/dev/null; }
          logout_all() { crane auth logout ghcr.io >/dev/null 2>&1 || true; }
          fail=0
          while read -r name tag rest; do
            [[ -z "$name" || "$name" == \#* ]] && continue
            digest=""; private=0
            for f in $rest; do
              case "$f" in sha256:*) digest="$f" ;; private=1) private=1 ;; esac
            done
            if [[ " $PROTECTED " == *" $name "* ]]; then
              echo "::error::$name ist ein eigenes gekko32-Image und darf nicht gespiegelt werden"; fail=1; continue
            fi
            # Zielschutz: vorhandenes Ziel nur mit Marker-Tag beschreiben
            login_dst
            if tags="$(crane ls "$DST/$name" 2>/dev/null)" && [[ -n "$tags" ]] && ! grep -qx "$MARKER" <<<"$tags"; then
              echo "::error::$DST/$name existiert ohne Marker $MARKER (eigenes Image?), uebersprungen"; fail=1; continue
            fi
            refs=()
            [[ "$tag" != "-" ]] && refs+=("$tag")
            [[ -n "$digest" ]] && refs+=("$digest")
            [[ "$tag" != "latest" ]] && refs+=("latest")
            copied=""
            for r in "${refs[@]}"; do
              if [[ "$r" == sha256:* ]]; then src="$SRC/$name@$r"; dtag="mirror-${r#sha256:}"; dtag="${dtag:0:19}"
              else src="$SRC/$name:$r"; dtag="$r"; fi
              if [[ "$private" == 1 ]]; then
                [[ -n "$PADDIONE_READ" ]] || { echo "::error::$name ist privat, Secret PADDIONE_GHCR_READ_TOKEN fehlt"; fail=1; continue; }
                tmp="$(mktemp -d)"
                logout_all; login_src
                crane pull --format=oci "$src" "$tmp/img" || { echo "::warning::$src nicht lesbar"; rm -rf "$tmp"; continue; }
                logout_all; login_dst
                crane push --index "$tmp/img" "$DST/$name:$dtag" >/dev/null
                rm -rf "$tmp"
              else
                logout_all; login_dst
                crane copy "$src" "$DST/$name:$dtag" || { echo "::warning::$src nicht kopierbar"; continue; }
              fi
              echo "$src -> $DST/$name:$dtag ($(crane digest "$DST/$name:$dtag"))"
              copied="${copied:-$dtag}"
            done
            if [[ -z "$copied" ]]; then
              echo "::error::$name: nichts kopiert"; fail=1; continue
            fi
            # Marker setzen, damit spaetere Laeufe dieses Ziel als Mirror erkennen
            crane tag "$DST/$name:$copied" "$MARKER"
            # Gepinnte Digests muessen im Ziel exakt vorhanden sein
            if [[ -n "$digest" ]]; then
              crane digest "$DST/$name@$digest" >/dev/null || { echo "::error::$DST/$name@$digest fehlt nach dem Mirror"; fail=1; }
            fi
          done < images-mirror.txt
          logout_all
          exit "$fail"
