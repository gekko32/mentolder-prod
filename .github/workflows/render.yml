name: Render mentolder artifact
# Rendert nur die mentolder-Komponenten auf Basis von Paddione/Bachelorprojekt (UPSTREAM_REF),
# pusht ein signiertes OCI-Artefakt nach ghcr.io/gekko32/mentolder-manifests.
on:
  workflow_dispatch:
  push:
    branches: [main]
  # Zieht neue Website- und Brett-Images nach: rendert nur, wenn ghcr.io/gekko32/website:latest
  # oder gekko32/brett:latest eine Digest-Kombination hat, zu der es noch kein Artefakt-Tag img-<hash> gibt.
  schedule:
    - cron: '*/20 * * * *'

concurrency:
  group: render-mentolder-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write   # keyless cosign

env:
  ARTIFACT: ghcr.io/gekko32/mentolder-manifests

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # push erst nach bewusstem Einschalten (Repo-Variable FLUX_ENABLED=true).
    if: github.event_name != 'push' || vars.FLUX_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay
          fetch-tags: false

      - name: Check out upstream at pinned revision
        run: |
          set -euo pipefail
          ref="$(tr -d '[:space:]' < overlay/UPSTREAM_REF)"
          git clone --quiet https://github.com/Paddione/Bachelorprojekt.git upstream
          git -C upstream checkout --quiet "$ref"

      - name: Apply overlay on upstream
        run: |
          set -euo pipefail
          for p in prod-mentolder prod-fleet/mentolder prod-fleet/website-mentolder \
                   environments/mentolder.yaml environments/fleet-mentolder.yaml; do
            mkdir -p "upstream/$(dirname "$p")"
            rm -rf "upstream/$p"
            cp -r "overlay/$p" "upstream/$p"
          done

      - name: Install kustomize, flux CLI, crane, cosign
        run: |
          set -euo pipefail
          rm -f /usr/local/bin/kustomize
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s -- 5.4.3 /usr/local/bin
          curl -sSL https://fluxcd.io/install.sh | sudo bash
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin crane
          COSIGN_VERSION=3.1.3
          COSIGN_SHA256=4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
          curl -sSL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
            -o /usr/local/bin/cosign
          echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
          chmod +x /usr/local/bin/cosign

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image digests
        id: digests
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source overlay/images.env
          # Leer = aktuelles :latest. Ein gesetzter Wert in images.env pinnt bewusst.
          if [[ -z "${WEBSITE_IMAGE_DIGEST:-}" ]]; then
            WEBSITE_IMAGE_DIGEST="$(crane digest ghcr.io/gekko32/website:latest)" \
              || { echo "gekko32/website nicht lesbar: WEBSITE_IMAGE_DIGEST in images.env setzen." >&2; exit 1; }
          fi
          if [[ -z "${BRETT_IMAGE_DIGEST:-}" ]]; then
            BRETT_IMAGE_DIGEST="$(crane digest ghcr.io/gekko32/brett:latest)" \
              || { echo "gekko32/brett nicht lesbar: BRETT_IMAGE_DIGEST in images.env setzen." >&2; exit 1; }
          fi
          echo "WEBSITE_IMAGE_DIGEST=$WEBSITE_IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "BRETT_IMAGE_DIGEST=$BRETT_IMAGE_DIGEST" >> "$GITHUB_ENV"
          # Ein Tag je Kombination aus Website- und Brett-Digest.
          tag="img-$(printf '%s%s' "$WEBSITE_IMAGE_DIGEST" "$BRETT_IMAGE_DIGEST" | sha256sum | cut -c1-16)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Geplanter Lauf: nichts tun, wenn fuer diesen Website-Digest schon ein Artefakt existiert.
          skip=false
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]] \
             && crane ls "${ARTIFACT}" 2>/dev/null | grep -qx "$tag"; then
            skip=true
            echo "Artefakt fuer $tag existiert bereits, nichts zu tun."
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Render mentolder components
        if: steps.digests.outputs.skip != 'true'
        working-directory: upstream
        env:
          CI: "true"
        run: |
          set -euo pipefail
          bash scripts/ci-dummy-secrets.sh
          bash scripts/flux-render-artifact.sh --out ../out \
            --only mentolder,website-mentolder

      - name: Push and sign OCI artifact
        if: steps.digests.outputs.skip != 'true'
        id: push
        run: |
          set -euo pipefail
          OUT="$(flux push artifact "oci://${ARTIFACT}:latest" \
            --path=./out \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}" \
            --output json)"
          digest="$(printf '%s' "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          flux tag artifact "oci://${ARTIFACT}:latest" --tag "sha-${GITHUB_SHA}"
          flux tag artifact "oci://${ARTIFACT}:latest" --tag "${{ steps.digests.outputs.tag }}"
          cosign sign --yes "${ARTIFACT}@${digest}"
