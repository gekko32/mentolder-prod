apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workspace

# Inherit full prod overlay (k3d base + all prod patches)
resources:
  - ../prod
  # ── dev.mentolder.de stack ───────────────────────────────────────
  # The dev SSO gate + TLS edge (oauth2-proxy-dev, dev-ingress,
  # cert-dev-wildcard, oauth2-proxy-dev-middleware) moved into the
  # self-contained k3d dev stack (k3d/dev-stack/) — [T000363].
  # Der dev-db-refresh-CronJob samt NetworkPolicy und Script-ConfigMap ist mit
  # T002699 entfallen: beide Konsumenten dieses Overlays verwarfen ihn, er
  # erreichte also keinen Cluster. prod-fleet/mentolder loeschte ihn explizit,
  # prod-fleet/mentolder-jobs implizit (es entfernt alle Nicht-Job-Typen).
  # Whisper + Talk-Transcriber laufen auf den fleet-CPs; die Platzierung setzt
  # prod-fleet/mentolder.
  - whisper.yaml
  - talk-transcriber.yaml

# Hier standen bis T002699 drei globale nodeAffinity-Patches (Deployment, CronJob,
# Job), die k3s-1/2/3 und k3w-1/2/3 per NotIn ausschlossen — die Worker des
# stillgelegten mentolder-Standalone-Clusters. Seit der Fleet-Konsolidierung
# (2026-05-31) existiert keiner dieser Knoten; der Cluster hat pk-hetzner-4/6/8
# und gekko-hetzner-3/4. Ein NotIn gegen nicht existierende Knoten schliesst
# nichts aus, ging aber mit rund 300 Zeilen bei jedem Reconcile nach Produktion.
#
# Mit ihnen fielen zwei JSON6902-op:replace-Overrides weg, die sich auf die von
# ihnen erzeugte Struktur bezogen: whisper (In: k3s-1/2/3) und dev-db-refresh
# (In: k3s-1). whisper wird ohnehin von prod-fleet/mentolder auf die
# pk-hetzner-Knoten gesetzt; dev-db-refresh entfaellt vollstaendig.
#
# Praezedenzfall derselben Bereinigung: k3d/pvc-backup-cronjob.yaml [T000368].
# Nicht wieder einfuegen, ohne vorher `kubectl get nodes` gegen fleet zu halten.
patches:
  - path: patch-backup-config.yaml
  - path: patch-data-pvc-storage.yaml
  - target:
      kind: Deployment
      name: brett
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: brett
      spec:
        template:
          spec:
            containers:
              - name: brett
                env:
                  - name: BRETT_PUBLIC_URL
                    value: "https://brett.mentolder.de"
                  - name: WEBSITE_INTERNAL_URL
                    value: "http://website.website.svc.cluster.local"
