# Whisper transcription service — mentolder.
# Copied from prod-korczewski/whisper.yaml.
#
# Placement: whisper laeuft auf den fleet-Control-Plane-Knoten
# (pk-hetzner-4/6/8). Gesetzt wird das NICHT hier, sondern vom Wrapper
# prod-fleet/mentolder/kustomization.yaml per strategic-merge-Patch.
# Die frueheren k3s-Home-Worker (k3s-1/2/3), auf die dieser Kommentar bis
# T002699 verwies, sind seit der Fleet-Konsolidierung stillgelegt.
# Die fleet-CPs haben keine GPU — Transkription ist hier best-effort.
#
# faster-whisper-server is amd64-only; nodeSelector enforces that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # speaches (Nachfolger von faster-whisper-server) laedt Modelle nicht selbst
      # nach ("not installed locally"). Der Vorab-Schritt holt das Modell in den
      # gemeinsamen HF-Cache (28.10.2026).
      initContainers:
        - name: modell-laden
          image: ghcr.io/speaches-ai/speaches:0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-small')"]
          env:
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: hf-cache
              mountPath: /home/ubuntu/.cache/huggingface
          # 512Mi reichte nicht: der Download (~480 MB) wurde OOMKilled (28.10.2026).
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1536Mi"
      containers:
        - name: whisper
          image: ghcr.io/speaches-ai/speaches:0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          # 28.10.2026: kleines Modell, int8, harte Speichergrenze. Die Knoten haben 8 GB;
          # mit 4Gi/8Gi konnte Whisper Nextcloud/Collabora verdraengen. Ein zu grosses
          # Modell trifft jetzt nur diesen Pod (OOM), nicht den Knoten.
          env:
            - name: ENABLE_UI
              value: "false"
            - name: WHISPER__COMPUTE_TYPE
              value: "int8"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "2"
          volumeMounts:
            - name: hf-cache
              mountPath: /home/ubuntu/.cache/huggingface
          # Model download can take a few minutes on first start
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
      volumes:
        - name: hf-cache
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: whisper
spec:
  selector:
    app: whisper
  ports:
    - port: 8000
      targetPort: 8000
