apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: office-wildcard
  namespace: workspace-office
  labels:
    app: collabora
spec:
  secretName: ${COLLABORA_TLS_SECRET}
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - "*.${PROD_DOMAIN}"
    - "${PROD_DOMAIN}"
