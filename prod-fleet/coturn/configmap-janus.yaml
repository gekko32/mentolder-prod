apiVersion: v1
kind: ConfigMap
metadata:
  name: janus-config
  namespace: coturn
data:
  janus.jcfg: |
    general: {
      configs_folder = "/etc/janus"
      log_to_stdout = true
      debug_level = 4
      admin_secret = "devjanusadmin"
    }
    nat: {
      nice_debug = false
      full_trickle = true
      ice_lite = true
      nat_1_1_mapping = "${TURN_PUBLIC_IP}"
      keep_private_host = false
    }
    media: {
      rtp_port_range = "20000-20200"
    }
    transports: {
      disable = "libjanus_transport.so"
    }
  janus.plugin.videoroom.jcfg: |
    general: {
    }
  janus.transport.websockets.jcfg: |
    general: {
      ws = true
      ws_port = 8188
      ws_logging = "err,warn"
    }
