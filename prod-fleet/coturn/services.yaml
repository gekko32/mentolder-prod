apiVersion: v1
kind: Service
metadata:
  name: coturn
  namespace: coturn
spec:
  selector:
    app: coturn
  ports:
    - name: turn-udp
      port: 3478
      protocol: UDP
      targetPort: 3478
    - name: turn-tcp
      port: 3478
      protocol: TCP
      targetPort: 3478
    - name: turns-tcp
      port: 5349
      protocol: TCP
      targetPort: 5349
---
apiVersion: v1
kind: Service
metadata:
  name: janus
  namespace: coturn
spec:
  selector:
    app: janus
  ports:
    - name: ws
      port: 8188
      protocol: TCP
      targetPort: 8188
