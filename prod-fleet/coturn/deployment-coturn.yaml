apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: coturn
  labels:
    app: coturn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: ${TURN_NODE}
      containers:
        - name: coturn
          image: coturn/coturn:4.18.0-alpine@sha256:c29135c08565810d37053f384584392b7c24b69570fc81a721b878d6fe63e04e
          imagePullPolicy: Always
          command: ["turnserver"]
          args:
            # T016533: --no-dtls/--no-cli/--ne existieren in coturn 4.18 nicht
            # mehr (unrecognized/ambiguous -> exit 255). DTLS/CLI sind dort
            # opt-in (--dtls/--cli), ne war intern — Weglassen erhaelt Verhalten.
            - --listening-port=3478
            - --tls-listening-port=5349
            - --cert=/etc/coturn-tls/tls.crt
            - --pkey=/etc/coturn-tls/tls.key
            - --min-port=49152
            - --max-port=49252
            - --realm=turn.${PROD_DOMAIN}
            - --use-auth-secret
            - --static-auth-secret=$(TURN_SECRET)
            - --external-ip=${TURN_PUBLIC_IP}
            - --listening-ip=0.0.0.0
            - --no-multicast-peers
            - --fingerprint
            - --log-file=stdout
            - --no-stdout-log
            - --simple-log
          env:
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: coturn-secrets
                  key: TURN_SECRET
          ports:
            - containerPort: 3478
              hostPort: 3478
              protocol: TCP
            - containerPort: 3478
              hostPort: 3478
              protocol: UDP
            - containerPort: 5349
              hostPort: 5349
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            appArmorProfile:
              type: Unconfined
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
            runAsUser: 0
          volumeMounts:
            - mountPath: /etc/coturn-tls
              name: coturn-tls
              readOnly: true
      volumes:
        - name: coturn-tls
          secret:
            secretName: ${TLS_SECRET_NAME}
