# sessions.mentolder.de — Wildcard-Cert + IngressRoute für session-<slug>.sessions.mentolder.de
# Benutzer setzt: *.${SESSIONS_DOMAIN} CNAME mentolder.de (oder fleet-IP direkt).
# Cert wird via DNS-01 (ipv64-Webhook) automatisch ausgestellt.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sessions-wildcard
  namespace: workspace
spec:
  secretName: sessions-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.${SESSIONS_DOMAIN}"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sessions-server
  namespace: workspace
spec:
  entryPoints:
    - websecure
  routes:
    # T016251: /oauth2-Callback-Route VOR dem Board-Gate — sie bedient den
    # OAuth2-Roundtrip (redirect_url=https://session-login.sessions.mentolder.de/
    # oauth2/callback). Der Slug "login" ist damit reserviert.
    - kind: Rule
      match: HostRegexp(`^session-[a-z0-9-]+\.${SESSIONS_DOMAIN}$`) && PathPrefix(`/oauth2`)
      priority: 20
      services:
        - name: oauth2-proxy-session-hub
          port: 4180
    # T016251: Pocket-ID-Gate (forwardAuth) — Muster aus k3d/dev-stack/
    # oauth2-proxy-sessions.yaml, hier für die Prod-Wildcard-Hosts.
    - kind: Rule
      match: HostRegexp(`^session-[a-z0-9-]+\.${SESSIONS_DOMAIN}$`)
      middlewares:
        - name: session-hub-auth
        - name: session-hub-errors
      services:
        - name: sessions-server
          port: 80
  tls:
    secretName: sessions-wildcard-tls
