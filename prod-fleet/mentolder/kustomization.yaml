apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# mentolder brand on fleet (gekko) — reuse the existing prod-mentolder overlay, then
# apply fleet-common (delete the cluster singletons now owned by
# prod-fleet/platform). Namespace stays workspace (set by the prod-mentolder/k3d
# base). Zielbild T016529 (D2/D3/Q16): nur Prod auf gekko-hetzner-2/3/4
# (embedded etcd), kein Longhorn (local-path als Default-StorageClass);
# staging-/dev-/korczewski-Pfade laufen nicht ueber diese Kustomization
# (Ziel devmesh). Website affinity comes from WEBSITE_NODE_AFFINITY in
# environments/fleet-mentolder.yaml.
resources:
  - ../../prod-mentolder
  - ../../prod/monitoring
  - studio-ingress.yaml
  - fuehrungsfunk.yaml
components:
  - ../components/fleet-common
  # D3 (T016529): kein Longhorn mehr — die fruehere llm-models-longhorn-
  # Komponente ist entfernt; bge-Modell-PVCs nutzen die Default-StorageClass
  # (local-path) wie die k3d-Basis.

# KI-Dienste bleiben intern vorhanden, starten standardmaessig aber keine Pods.
# Aktivierung per GitOps: count von 0 auf 1; siehe docs/runbooks/ai-services-scale-zero.md.
replicas:
  - name: whisper
    count: 0
  - name: talk-transcriber
    count: 0
  - name: talk-recording
    count: 0
  - name: bge-embed
    count: 0
  - name: bge-embed-bulk
    count: 0
  - name: bge-rerank
    count: 0

# Exclude the dev.mentolder.de stack from fleet Phase 2a (dev migration is 2c).
# prod-mentolder renders these dev resources; with DEV_* blanked in
# environments/fleet-mentolder.yaml they would either be invalid (the dev
# Ingress/Certificate render with empty hosts -> "*." / null dnsNames, rejected
# by the API — surfaced by the Task 8 server-side dry-run) or dangerous (the
# dev-db-refresh CronJob drops + recreates databases). Delete them here in the
# mentolder wrapper (NOT fleet-common — korczewski has no equivalents, so a shared
# delete would error). The harmless *.localhost dev IngressRoutes are left intact.
patches:
  # T016544: bge-hosts-patch.yaml ist entfallen — die llm-gateway-IngressRoutes
  # werden per $patch:delete unten entfernt; ein Patch ohne Ziel wuerde den Build
  # fehlschlagen lassen.
  # Coaching Studio — prod overlay for mentolder brand on the fleet
  # cluster. Pins image-digest, prod-issuer, prod TLS, and node-affinity
  # for fleet pk nodes. (T001002)
  - path: studio-patch.yaml
  # Brett prod patch
  - target:
      kind: Deployment
      name: brett
    path: brett-patch.yaml
  # NOTE: the dev SSO/TLS edge (workspace-ingress-dev, workspace-dev-wildcard-tls
  # Certificate, oauth2-proxy-dev Service/Deployment/Middleware) is no longer
  # rendered by prod-mentolder — it moved into the self-contained k3d dev stack
  # (k3d/dev-stack/). Their $patch:delete blocks were removed here [T000363].
  # Die drei dev-db-refresh-Deletes (CronJob, Script-ConfigMap, NetworkPolicy)
  # sind mit T002699 ebenfalls entfallen: prod-mentolder rendert diese Ressourcen
  # nicht mehr, es gibt also nichts zu loeschen. Ein $patch:delete auf eine
  # Ressource, die gar nicht entsteht, ist folgenlos — behauptet aber die Existenz
  # von etwas, das es nicht gibt.

  # T002207: remove all one-shot Jobs from the brand overlay — they now
  # live in flux-<brand>-jobs Kustomization with force:true and wait:false,
  # preventing a broken Job from gating the entire brand deploy.
  - target: { group: batch, version: v1, kind: Job }
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: any-job

  # Externe llm-gateway-Routen bleiben deaktiviert (T016544).
  - target: { group: traefik.io, version: v1alpha1, kind: IngressRoute, name: llm-gateway-embed }
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: llm-gateway-embed
  - target: { group: traefik.io, version: v1alpha1, kind: IngressRoute, name: llm-gateway-rerank }
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: llm-gateway-rerank

  # T016559: Vaultwarden-App aus fleet-new Prod entfernen (Deployment,
  # Service, Ingress, NetPol, Daten-PVC, zugehoerige Middleware). Die DB
  # 'vaultwarden' in shared-db bleibt erhalten (Backup unter /tmp/t016559-pg).
  - target: { group: apps, version: v1, kind: Deployment, name: vaultwarden }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vaultwarden
  - target: { version: v1, kind: Service, name: vaultwarden }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: vaultwarden
  - target: { version: v1, kind: PersistentVolumeClaim, name: vaultwarden-data-pvc }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: vaultwarden-data-pvc
  - target: { group: networking.k8s.io, version: v1, kind: Ingress, name: workspace-ingress-vault }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: workspace-ingress-vault
  - target: { group: networking.k8s.io, version: v1, kind: NetworkPolicy, name: allow-website-to-vaultwarden-ingress }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-website-to-vaultwarden-ingress
  - target: { group: traefik.io, version: v1alpha1, kind: Middleware, name: rate-limit-vault }
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: rate-limit-vault

  # T016560: Knowledge-Ingest-CronJobs laufen nur noch in Dev (devmesh) —
  # aus dem Fleet-Overlay entfernen (Datenbankziele zeigen nach Dev).
  - target: { group: batch, version: v1, kind: CronJob, name: knowledge-ingest-prs }
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: knowledge-ingest-prs
  - target: { group: batch, version: v1, kind: CronJob, name: knowledge-ingest-markdown }
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: knowledge-ingest-markdown
  - target: { group: batch, version: v1, kind: CronJob, name: knowledge-ingest-bugs }
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: knowledge-ingest-bugs
  - target: { group: batch, version: v1, kind: CronJob, name: knowledge-reindex-all }
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: knowledge-reindex-all

  # T016561: Videovault + Mediaviewer-Widget laufen nur noch in Dev
  # (devmesh) — aus dem Fleet-Overlay entfernen (Deployments, Services,
  # Ingresses, Middleware, Uploads-PVC, oauth2-Proxys).
  - target: { group: apps, version: v1, kind: Deployment, name: videovault }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: videovault
  - target: { version: v1, kind: Service, name: videovault }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: videovault
  - target: { version: v1, kind: PersistentVolumeClaim, name: videovault-uploads-pvc }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: videovault-uploads-pvc
  - target: { group: networking.k8s.io, version: v1, kind: Ingress, name: workspace-ingress-videovault }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: workspace-ingress-videovault
  - target: { group: apps, version: v1, kind: Deployment, name: oauth2-proxy-videovault }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: oauth2-proxy-videovault
  - target: { version: v1, kind: Service, name: oauth2-proxy-videovault }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: oauth2-proxy-videovault
  - target: { group: apps, version: v1, kind: Deployment, name: mediaviewer-widget }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mediaviewer-widget
  - target: { version: v1, kind: Service, name: mediaviewer-widget }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: mediaviewer-widget
  - target: { group: networking.k8s.io, version: v1, kind: Ingress, name: workspace-ingress-mediaviewer }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: workspace-ingress-mediaviewer
  - target: { group: traefik.io, version: v1alpha1, kind: Middleware, name: mediaviewer-embed-headers }
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: mediaviewer-embed-headers
  - target: { group: apps, version: v1, kind: Deployment, name: oauth2-proxy-mediaviewer }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: oauth2-proxy-mediaviewer
  - target: { version: v1, kind: Service, name: oauth2-proxy-mediaviewer }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: oauth2-proxy-mediaviewer

  # Entwicklungswerkzeuge gehoeren nicht in Prod (dotfiles bzw. devmesh): ComfyUI/Rigger,
  # Web-Terminal, GPU-Host-Egress, *.localhost-Routen und der Dev-Stack-Zugang zu Pocket-ID.
  # tracking.mentolder.de zeigte auf den nicht vorhandenen Service bachelorprojekt.
  - target: { group: networking.k8s.io, version: v1, kind: Ingress, name: workspace-ingress-tracking }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
