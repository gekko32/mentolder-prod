  - target: { group: traefik.io, version: v1alpha1, kind: IngressRoute, name: studio-localhost }
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: studio-localhost
  - target: { group: traefik.io, version: v1alpha1, kind: IngressRoute, name: traefik-dashboard-dev }
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: traefik-dashboard-dev
  - target: { group: networking.k8s.io, version: v1, kind: NetworkPolicy, name: allow-llm-gateway-egress }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-llm-gateway-egress
  - target: { group: networking.k8s.io, version: v1, kind: NetworkPolicy, name: allow-devstack-to-pocket-id-ingress }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-devstack-to-pocket-id-ingress

  # IP-Allowlist auf das Entwicklernetz 192.168.100.0/24, von keiner Route mehr genutzt.
  - target: { group: traefik.io, version: v1alpha1, kind: Middleware, name: wg-only }
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: wg-only

  # www.mentolder.de wie die Apex-Domain auf web.mentolder.de umleiten (vorher 404).
  - target: { group: networking.k8s.io, version: v1, kind: Ingress, name: workspace-ingress-apex }
    patch: |-
      - op: add
        path: /spec/rules/-
        value:
          host: www.mentolder.de
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: old-webspace
                    port:
                      number: 443
      - op: add
        path: /spec/tls/0/hosts/-
        value: www.mentolder.de
  - target: { group: traefik.io, version: v1alpha1, kind: Middleware, name: redirect-apex-to-web }
    patch: |-
      - op: replace
        path: /spec/redirectRegex/regex
        value: ^https?://(?:www\.)?mentolder\.de(.*)

# Eigene Images (Quellen in diesem Repo, Builds: build-images.yml, build-downloads.yml).
# Die Basen referenzieren ghcr.io/gekko32/<name>:latest. render.yml setzt hier vor dem
# Render per `kustomize edit set image` die Digests von :latest (oder die Pins aus
# images.env), damit das Artefakt digest-gepinnt ist. website und brett laufen ueber
# WEBSITE_IMAGE_DIGEST/BRETT_IMAGE_DIGEST.
images:
  - name: ghcr.io/paddione/workspace-brett
    newName: ghcr.io/gekko32/brett
  - name: ghcr.io/paddione/website
    newName: ghcr.io/gekko32/website
