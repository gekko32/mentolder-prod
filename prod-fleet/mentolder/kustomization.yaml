      kind: Deployment
      metadata:
        name: talk-recording
  - target: { group: apps, version: v1, kind: Deployment, name: talk-transcriber }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
