  - target: { version: v1, kind: Endpoints, name: terminal-bridge }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Endpoints
      metadata:
        name: terminal-bridge
  - target: { version: v1, kind: Endpoints, name: rigger-gateway }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Endpoints
      metadata:
        name: rigger-gateway
  - target: { group: traefik.io, version: v1alpha1, kind: Middleware, name: terminal-embed-headers }
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: terminal-embed-headers
  - target: { group: traefik.io, version: v1alpha1, kind: IngressRoute, name: mailpit-dev }
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
