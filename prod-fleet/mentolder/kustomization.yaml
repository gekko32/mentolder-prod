  - target: { version: v1, kind: Service, name: comfy-gateway }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: comfy-gateway
  - target: { version: v1, kind: Service, name: terminal-bridge }
    patch: |-
      $patch: delete
      apiVersion: v1
