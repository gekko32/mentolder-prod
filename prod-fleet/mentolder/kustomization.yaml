  - target: { version: v1, kind: Service, name: whisper }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: whisper
  - target: { version: v1, kind: Service, name: talk-recording }
    patch: |-
