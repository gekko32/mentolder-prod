  - target: { group: networking.k8s.io, version: v1, kind: NetworkPolicy, name: allow-website-to-bge-rerank-ingress }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-website-to-bge-rerank-ingress
  - target: { version: v1, kind: PersistentVolumeClaim, name: bge-embed-models }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: bge-embed-models
  - target: { version: v1, kind: PersistentVolumeClaim, name: bge-rerank-models }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
