  # T016559: Vaultwarden-App aus fleet-new Prod entfernen (Deployment,
  # Service, Ingress, NetPol, Daten-PVC, zugehoerige Middleware). Die DB
  # 'vaultwarden' in shared-db bleibt erhalten (Backup unter /tmp/t016559-pg).
  - target: { group: apps, version: v1, kind: Deployment, name: vaultwarden }
    patch: |-
