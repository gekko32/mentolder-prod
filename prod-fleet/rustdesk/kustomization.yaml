# RustDesk-Relay (hbbs/hbbr), uebernommen aus Bachelorprojekt 01fb13bbe (#6736).
# Always-on (replicas: 1): der On-demand-Sleeper (k3d/rustdesk-stack/on-demand.yaml)
# ist bewusst NICHT Teil des Flux-Pfads, Flux wuerde ein imperatives Scale-to-0
# zuruecknehmen. rustdesk-secrets (ed25519-Keypair) kommt SOPS-verschluesselt aus
# ./secrets, deshalb ohne k3d/rustdesk-stack/secret.yaml (Platzhalter). Kein
# Ingress/TLS (hostNetwork, rohe TCP/UDP-Ports); das Image ist oeffentlich.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k3d/rustdesk-stack/namespace.yaml
  - ../../k3d/rustdesk-stack/hbbs.yaml
  - ../../k3d/rustdesk-stack/hbbr.yaml
