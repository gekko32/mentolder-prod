apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# ── Debug-Logging fuer die Staging-Umgebung [T900018] ────────────────────────
#
# Zweck: Nach einem Restart sollen die Logs ALLER Services in workspace-staging
# auf fehlende Implementierungen (501, "not implemented", stub-Handler, tote
# Routen, fehlende Env-Vars) durchsuchbar sein. Ausgewertet wird mit
# `scripts/collect-debug-logs.sh` bzw. `task logs:debug-scan ENV=staging`.
#
# NUR STAGING. Diese Component wird bewusst NICHT von prod-fleet/mentolder oder
# prod-fleet/korczewski eingebunden: Debug-Logs enthalten regelmaessig
# Request-Bodies, Header und User-IDs — in Prod waere das ein DSGVO-Problem und
# ausserdem ein Loki-Volumen-Problem.
#
# Mechanik: Jeder Patch setzt eine explizite `env`-Variable am Container.
# Explizite `env`-Eintraege gewinnen in Kubernetes gegen `envFrom`-Werte aus
# ConfigMaps — die `PINO_LOG_LEVEL: "info"`-Defaults in den ConfigMaps werden
# dadurch ueberschrieben, ohne dass die ConfigMap selbst angefasst werden muss.
#
# ── Bewusst NICHT abgedeckt (kein Env-Schalter vorhanden) ────────────────────
# Diese Container konfigurieren ihren Log-Level ueber Kommandozeilen-Argumente
# oder Config-Dateien. Ein strategic-merge-Patch auf `args` ERSETZT die Liste
# vollstaendig, statt sie zu ergaenzen — das wuerde die Start-Parameter dieser
# Dienste stillschweigend zerstoeren. Sie werden stattdessen zur Laufzeit vom
# Sammelskript behandelt (siehe scripts/collect-debug-logs.sh --runtime):
#   * nats             (-DV als arg)
#   * nextcloud-redis  (--loglevel debug als arg)
#   * shared-db        (postgres -c log_min_messages=... als arg)
#   * spreed-signaling (server.conf, ConfigMap-basiert)
#   * talk-recording   (recording.conf, ConfigMap-basiert)
#   * penpot           (logback.xml im Image)
#   * penminio         (MinIO kennt keinen Log-Level-Schalter)
#   * sessions-server  (nginx error_log, nur via nginx.conf)
#   * nextcloud        (occ config:system:set loglevel — Laufzeit, siehe Skript)

patches:
  # ── Eigene Node-/Astro-Dienste ────────────────────────────────────────────
  - target: { kind: Deployment, name: brett }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: brett }
      spec:
        template:
          spec:
            containers:
              - name: brett
                env:
                  - name: LOG_LEVEL
                    value: "debug"
                  - name: PINO_LOG_LEVEL
                    value: "debug"

