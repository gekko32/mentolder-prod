  # ── LLM-Gateways (llama.cpp server) ───────────────────────────────────────
  #     llama.cpp liest LLAMA_ARG_* als Env-Aequivalent seiner CLI-Flags, damit
  #     die bestehende args-Liste unangetastet bleibt.
  - target: { kind: Deployment, name: bge-embed }
