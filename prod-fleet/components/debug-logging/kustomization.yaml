  # ── oauth2-proxy-Gates ────────────────────────────────────────────────────
  #     Die Gateway-Schicht macht fehlende Endpunkte an der Kante sichtbar:
  #     Request-Logging protokolliert jeden 404/501, den ein Upstream liefert.
  #     SILENCE_PING_LOGGING bleibt auf true — /ping ist Health-Check-Rauschen
  #     und wuerde die interessanten Zeilen im Log begraben.
  #     Gepatcht wird nur der Container `oauth2-proxy`; der busybox-initContainer
  #     jedes Deployments bleibt unberuehrt.
  - target: { kind: Deployment, name: oauth2-proxy-brett }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: oauth2-proxy-brett }
      spec:
        template:
          spec:
            containers:
              - name: oauth2-proxy
                env:
                  - name: OAUTH2_PROXY_STANDARD_LOGGING
                    value: "true"
                  - name: OAUTH2_PROXY_AUTH_LOGGING
                    value: "true"
                  - name: OAUTH2_PROXY_REQUEST_LOGGING
                    value: "true"
                  - name: OAUTH2_PROXY_SILENCE_PING_LOGGING
                    value: "true"
  - target: { kind: Deployment, name: oauth2-proxy-comfy }
    patch: |-
