apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# T002551: bge-Modell-PVCs (k3d/llm-gpu.yaml) auf Longhorn pinnen.
#
# Die Basis (k3d/llm-gpu.yaml) bleibt storageClassName-frei, damit der lokale
# k3d-dev-Cluster die Default-SC (local-path) nutzt. Im Fleet-Cluster sitzen die
# GGUF-Modelle so auf dem replizierten Longhorn statt auf node-lokalem
# local-path — kein erneuter HF-Download nach Node-Ausfall.
patches:
  - path: storageclass-patch.yaml
