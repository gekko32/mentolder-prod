apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: website
resources:
  - ../../k3d/website.yaml
  - ../../k3d/website-seller-config.yaml
  # mentolder HTTPS Ingress (tracked here to survive cluster rebuilds — T000146)
  - ../website-common/domain-config.yaml
  # T002052: website-scoped security-headers (no noindex) — keeps the public site crawlable
  - website-security-headers.yaml
  - website-ingress-web.yaml
patches:
  - target:
      kind: Deployment
      name: website
    path: website-patch.yaml
  # Egress zum GPU-Entwicklungshost (192.168.100.0/24) gehoert nicht in Prod.
  - target: { group: networking.k8s.io, version: v1, kind: NetworkPolicy, name: allow-llm-egress }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-llm-egress
