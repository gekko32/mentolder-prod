apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
spec:
  template:
    spec:
      containers:
        - name: website
          # Eigenes Website-Image (Gerald, 19.10.2026): gebaut aus github.com/gekko32/website.
          image: ghcr.io/gekko32/website@${WEBSITE_IMAGE_DIGEST}
          # T016560: Vektor-Suche (Codesearch + Knowledge) nur in Dev —
          # Prod-Website bleibt ohne Vector-DB (Extension wird gedroppt).
          env:
            - name: VECTOR_DB_ENABLED
              value: "0"
            # E-Mail-Versand im Adminbereich (Website SPEZ-EMAIL-VERSAND, E1, 23.10.2026): Schlüssel,
            # mit dem die Website das SMTP-Passwort aus den Einstellungen verschlüsselt. optional:
            # ohne ihn startet die Website trotzdem und versendet über die Server-Einstellung.
            - name: MAIL_SETTINGS_KEY
              valueFrom:
                secretKeyRef:
                  name: website-mailkey
                  key: MAIL_SETTINGS_KEY
                  optional: true
