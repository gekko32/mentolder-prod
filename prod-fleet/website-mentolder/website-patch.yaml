apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
spec:
  template:
    spec:
      containers:
        - name: website
          # Eigenes Website-Image (Gerald, 19.10.2026): gebaut aus github.com/gekko32/website.
          image: ghcr.io/gekko32/website@${WEBSITE_IMAGE_DIGEST}
          # T016560: Vektor-Suche (Codesearch + Knowledge) nur in Dev —
          # Prod-Website bleibt ohne Vector-DB (Extension wird gedroppt).
          env:
            - name: VECTOR_DB_ENABLED
              value: "0"
