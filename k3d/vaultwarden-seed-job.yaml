apiVersion: batch/v1
kind: Job
metadata:
  name: vaultwarden-seed
  namespace: workspace
  labels:
    app: vaultwarden
spec:
  template:
    spec:
      containers:
        - name: seeder
          image: node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Installing Bitwarden CLI..."
              npm install -g @bitwarden/cli

              echo "Configuring Bitwarden CLI server..."
              bw config server "https://${VAULT_DOMAIN:-vault.localhost}"

              echo "Logging into Vaultwarden..."
              # Note: This requires the account to already exist (created via web vault)
              export BW_SESSION=$(bw login "$BW_EMAIL" "$BW_PASSWORD" --raw)

              if [ -z "$BW_SESSION" ]; then
                echo "Failed to login. Please ensure the account exists and credentials are correct."
                exit 1
              fi

              echo "Seeding production secret templates..."

              # Create Organization if it doesn't exist
              ORG_ID=$(bw list organizations | jq -r '.[0].id // empty')
              if [ -z "$ORG_ID" ]; then
                echo "Please create an organization manually first."
                # In a real scenario, we might try to automate this if the API allowed easily
              fi

              # Create common collections/folders
              bw create folder '{"name":"Infrastructure"}'
              bw create folder '{"name":"Services"}'
              bw create folder '{"name":"MCP Keys"}'

              # Seed workspace service URLs (upsert: delete existing by name, then create)
              upsert_login() {
                local name="$1" uri="$2" notes="$3"
                # Delete any existing item with the same name
                local existing_id
                existing_id=$(bw list items --search "$name" 2>/dev/null | jq -r ".[] | select(.name==\"$name\") | .id" | head -1)
                [ -n "$existing_id" ] && bw delete item "$existing_id" 2>/dev/null || true
                local item
                item=$(bw get template item | jq \
                  --arg n "$name" --arg u "$uri" --arg note "$notes" \
                  '.type=1 | .name=$n | .notes=$note | .login.uris=[{"match":null,"uri":$u}]')
                echo "$item" | bw encode | bw create item
              }

              # NC, AUTH, WEB, OFFICE are shell-local aliases resolved from
              # *_DOMAIN env vars at runtime — NOT Taskfile envsubst targets.
              NC="${NC_DOMAIN:-files.localhost}"
              AUTH="${POCKET_ID_DOMAIN:-auth.localhost}"
              WEB="${WEB_DOMAIN:-web.localhost}"
              OFFICE="${OFFICE_DOMAIN:-office.localhost}"

              upsert_login "Nextcloud — Dateien"            "https://${NC}"               "Dateispeicher und Kollaboration"
              upsert_login "Nextcloud Talk — Video"         "https://${NC}/apps/spreed"   "Video-/Sprachanrufe via Nextcloud Talk"
              upsert_login "Whiteboard"                     "https://${NC}/apps/whiteboard" "Kollaboratives Whiteboard (Nextcloud-App, nicht board.* öffnen)"
              upsert_login "Collabora Office"               "https://${OFFICE}"           "Online-Office (Word/Excel/Impress)"
              upsert_login "Pocket ID — Benutzerverwaltung" "https://${AUTH}"             "SSO und Benutzerverwaltung (Pocket ID)"
              upsert_login "Portal — Kundenbereich"         "https://${WEB}/portal"       "Kundenportal (Login via Pocket ID SSO)"
              upsert_login "Admin — Website-Verwaltung"     "https://${WEB}/admin"        "Website-Admin (Login via Pocket ID SSO)"

              echo "Vaultwarden seeding completed successfully."
          env:
            - name: BW_EMAIL
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-seed-credentials
                  key: BW_EMAIL
            - name: BW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-seed-credentials
                  key: BW_PASSWORD
            - name: VAULT_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: domain-config
                  key: VAULT_DOMAIN
                  optional: true
            - name: NC_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: domain-config
                  key: NC_DOMAIN
                  optional: true
            - name: POCKET_ID_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: domain-config
                  key: POCKET_ID_DOMAIN
                  optional: true
            - name: WEB_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: domain-config
                  key: WEB_DOMAIN
                  optional: true
            - name: OFFICE_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: domain-config
                  key: COLLABORA_DOMAIN
                  optional: true
      restartPolicy: OnFailure
  backoffLimit: 2
