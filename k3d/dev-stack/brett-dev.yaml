apiVersion: apps/v1
kind: Deployment
metadata:
  name: brett
  labels:
    app: brett
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brett
  template:
    metadata:
      labels:
        app: brett
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: brett
          image: ghcr.io/paddione/workspace-brett:dev
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: POCKET_ID_URL
              value: http://pocket-id.workspace.svc.cluster.local:1411
            - name: POCKET_ID_PUBLIC_URL
              value: https://auth.${PROD_DOMAIN}
            - name: BRETT_CLIENT_ID
              value: brett-dev
            - name: BRETT_PUBLIC_URL
              value: https://${DEV_BRETT_HOST}
            - name: POCKET_ID_BRETT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dev-oidc-secrets
                  key: POCKET_ID_BRETT_DEV_SECRET
            - name: BRETT_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: dev-oidc-secrets
                  key: BRETT_SESSION_SECRET
            - name: WEBSITE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-db-dev-secrets
                  key: DEV_WEBSITE_DB_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://website:$(WEBSITE_DB_PASSWORD)@shared-db-dev.workspace-dev.svc.cluster.local:5432/website?sslmode=disable"
          readinessProbe:
            # /healthz wie in k3d/brett.yaml: "/" laeuft in den OIDC-Flow und
            # antwortet ohne konfigurierten Pocket-ID-Client mit 500 — der Pod
            # wurde dadurch nie ready und hielt die flux-dev-Kustomization rot.
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 250m
      volumes:
        # T016422: tsx legt IPC-Tempdirs als /tmp/<uid> an (hier /tmp/tsx-1000);
        # readOnlyRootFilesystem macht das Container-Layer read-only, das mkdir
        # schlug mit ENOENT fehl -> CrashLoopBackOff (152 Restarts), bis der
        # flux-dev-Kustomization jeder weitere Fortschritt blockiert war.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: brett
spec:
  selector:
    app: brett
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brett-dev
spec:
  rules:
    - host: ${DEV_BRETT_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brett
                port:
                  number: 80
