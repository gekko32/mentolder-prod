# k3d/dev-stack/sdlc-console-secrets.yaml [T016429]
# Platzhalter-Secret für Keys, die die Console per secretKeyRef erwartet, die
# im Fleet-dev aber (noch) keinen echten Wert haben — Muster
# k3d/sdlc-stack/sdlc-secrets-patch.yaml: bewusst unbrauchbare Werte, damit der
# Pod startet und Nicht-LLM-/Nicht-GitHub-Pfade sauber degradieren.
apiVersion: v1
kind: Secret
metadata:
  name: sdlc-console-placeholders
  labels:
    app: sdlc-console
type: Opaque
stringData:
  POCKET_ID_WEBSITE_SECRET: "dev-placeholder-not-usable"
  CRON_SECRET: "dev-placeholder-not-usable"
  GITHUB_PAT: "dev-placeholder-not-usable"
