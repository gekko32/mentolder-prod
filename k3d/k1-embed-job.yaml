apiVersion: batch/v1
kind: Job
metadata:
  name: k1-embed-$JOB_ID
  namespace: workspace
  labels:
    app: k1-embed
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  activeDeadlineSeconds: 5400
  template:
    metadata:
      labels:
        app: k1-embed
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: git-fetch
          image: alpine/git@sha256:ae0f6f4bce38d2b8c40becc0d6241a08d9f57186ea03029de2189a2b5e722d94
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # [T900810] safe.directory zuerst: /repo ist ein root-owned emptyDir-Mount,
          # der Prozess laeuft als runAsUser 65534 — ohne die Ausnahme bricht JEDER
          # git-Befehl nach `init` mit exit 128 "dubious ownership" ab (der Job lief
          # dadurch nie ueber git-fetch hinaus). HOME=/tmp (unten) ist beschreibbar,
          # die Config landet in /tmp/.gitconfig (readOnlyRootFilesystem-konform).
          command: ["sh", "-c", "set -eu && git config --global --add safe.directory /repo && git init /repo && cd /repo && git remote add origin \"$REPO_URL\" && git fetch --depth 1 origin \"$MERGE_SHA\" && git checkout FETCH_HEAD"]
          env:
            - name: REPO_URL
              value: "$REPO_URL"
            - name: MERGE_SHA
              value: "$MERGE_SHA"
            - name: HOME
              value: "/tmp"
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: tmp
              mountPath: /tmp
        - name: npm-deps
          image: node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # [T900810] --legacy-peer-deps: npm 10.9.8 (im Node-Image) crasht beim
          # Aufloesen des Repo-Dev-Baums in arborist (#loadPeerSet, "edgesOut",
          # exit 1) — der Job kam dadurch nie ueber npm-deps hinaus. --no-save
          # verhindert zusaetzlich den Schreibversuch auf package.json.
          command: ["sh", "-c", "set -eu && cd /repo && npm install pg tsx --no-package-lock --legacy-peer-deps --no-save --silent"]
          env:
            - name: HOME
              value: "/tmp"
            - name: NPM_CONFIG_CACHE
              value: "/tmp/.npm"
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: tmp
              mountPath: /tmp
      containers:
        - name: embed
          image: node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
          imagePullPolicy: IfNotPresent
          workingDir: /repo
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # [T900810] workspace-secrets, nicht website-secrets: Letzteres existiert
            # nur im Namespace website — der Job lief dadurch in
            # CreateContainerConfigError (zweite k1-Root-Cause neben safe.directory).
            # Muster wie alle anderen workspace-Workloads (admin-actions, backup).
            - name: WEBSITE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workspace-secrets
                  key: WEBSITE_DB_PASSWORD
            - name: SESSIONS_DATABASE_URL
              value: "postgresql://website:$(WEBSITE_DB_PASSWORD)@shared-db.workspace.svc.cluster.local:5432/website"
            - name: PGHOST
              value: "shared-db.workspace.svc.cluster.local"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "website"
            - name: PGUSER
              value: "website"
            - name: PGPASSWORD
              value: "$(WEBSITE_DB_PASSWORD)"
            - name: LLM_ENABLED
              value: "true"
            - name: LLM_EMBED_MODEL
              value: "bge-m3"
            - name: LLM_EMBED_URL
              value: "http://llm-gateway-embed.workspace.svc.cluster.local:8081"
            - name: MERGE_SHA
              value: "$MERGE_SHA"
            - name: FULL
              value: "$FULL"
            - name: JOB_ID
              value: "$JOB_ID"
            - name: HOME
              value: "/tmp"
            - name: NPM_CONFIG_CACHE
              value: "/tmp/.npm"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: tmp
              mountPath: /tmp
            - name: diff
              mountPath: /diff
              readOnly: true
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              trap 'echo "k1-embed FAILED merge=$MERGE_SHA"' ERR
              echo "k1-embed start merge=$MERGE_SHA full=$FULL"
              DIFF_FILE="/diff/diff.txt"
              # [T900810] Nur FULL=1 triggert den Voll-Index. Der alte
              # "[ ! -s ]"-Fallback machte aus jedem Leer-Diff einen Full-Run,
              # der das Budget sprengt; leerer Diff meldet unten stattdessen
              # "keine indexierten Pfade" und schliesst gruen ab.
              if [ "$FULL" = "1" ]; then
                node scripts/knowledge/ingest-markdown.mjs
                npx tsx scripts/index-repo.ts
              else
                matched=0
                markdown_changed=0
                while IFS= read -r f || [ -n "$f" ]; do
                  [ -z "$f" ] && continue
                  case "$f" in
                    .agents/plans/*.md|docs/adr/*.md|docs/runbooks/*.md)
                      markdown_changed=1; matched=1 ;;
                    *.ts|*.mts|*.mjs|*.js|*.cjs|*.py|*.svelte|*.astro)
                      [ -f "$f" ] && { npx tsx scripts/index-repo.ts --file "$f"; matched=1; } ;;
                  esac
                done < "$DIFF_FILE"
                [ "$markdown_changed" -eq 1 ] && node scripts/knowledge/ingest-markdown.mjs
                [ "$matched" -eq 0 ] && echo "keine indexierten Pfade"
              fi
              echo "k1-embed COMPLETE merge=$MERGE_SHA"
      volumes:
        - name: repo
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: diff
          configMap:
            name: k1-embed-diff-$JOB_ID
