apiVersion: v1
kind: Namespace
metadata:
  name: workspace
  labels:
    app.kubernetes.io/part-of: workspace-mvp
    # Historically privileged for livekit-server (hostNetwork for UDP 50000-60000
    # WebRTC media). LiveKit removed per T002184; the privileged level is retained
    # as a safety margin for future workloads that may need hostNetwork (mirrors
    # the coturn namespace pattern). Other pods still get warned at restricted so
    # audits stay loud.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
