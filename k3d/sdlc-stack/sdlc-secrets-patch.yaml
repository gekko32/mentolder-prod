# ── SDLC-Stack: Dev-Secret-Lücken schließen ──────────────────────────────
# Der SDLC-Stack appliziert nur k3d/secrets.yaml — nie ein SealedSecret aus
# environments/sealed-secrets/. Keys, die für den dev-Pfad ausschließlich im
# SealedSecret dev.yaml liegen, fehlen hier deshalb zur Laufzeit.
#
# POCKET_ID_ENCRYPTION_KEY wird von k3d/pocket-id.yaml per secretKeyRef
# erwartet; ohne ihn bleibt der Pod in CreateContainerConfigError hängen
# ("couldn't find key POCKET_ID_ENCRYPTION_KEY").
#
# Der Key steht bewusst hier statt in k3d/secrets.yaml: dort würde er auf
# bestehenden Dev-Clustern den Wert aus dem SealedSecret überschreiben, und
# ein geänderter Encryption-Key macht bereits verschlüsselte Pocket-ID-Daten
# unlesbar. Dieser Patch wirkt nur im SDLC-Stack.
apiVersion: v1
kind: Secret
metadata:
  # Kein `namespace:` — der Namespace-Transformer der Kustomization läuft NACH
  # den Patches. Mit `namespace: workspace` sucht der Patch ein Ziel, das zu
  # diesem Zeitpunkt noch namespacelos ist, und schlägt mit "no matches for Id"
  # fehl.
  name: workspace-secrets
type: Opaque
stringData:
  POCKET_ID_ENCRYPTION_KEY: "dev-pocket-enc-c1e77d372779102c3d473c31070ec0b8b957472d884b6b312947f7fe7d2135e1"
