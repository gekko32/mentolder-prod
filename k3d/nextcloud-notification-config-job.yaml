apiVersion: batch/v1
kind: Job
metadata:
  name: nextcloud-notification-config
  namespace: workspace
  labels:
    app: nextcloud
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: disable-activity-digest
          # T016592/T900001: schaltet Nextclouds Activity-Digest- und
          # Mail-App-Mails ab.
          #
          # Warum ueber die Datenbank und nicht per `occ config:app:set`: occ
          # braucht das App-Verzeichnis aus dem PVC nextcloud-app. Das ist RWO
          # und liegt am Deployment-Pod — ein eigener Job koennte es auf einem
          # anderen Node nicht mitmounten. Nextcloud liest oc_appconfig und
          # oc_preferences zur Laufzeit, der Weg ist also aequivalent und
          # kommt ohne PVC-Kopplung aus.
          #
          # Transaktionale Nextcloud-Mails (Passwort-Reset, Freigabe-Einladung)
          # bleiben unberuehrt — hier faellt nur der Aktivitaets-Digest und die
          # Mail-App (T900001).
          image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Disabling Nextcloud notification mails (T016592/T900001)..."
              psql -v ON_ERROR_STOP=1 <<'SQL'
              -- Admin-Default: kein Aktivitaets-Digest, keine Digest-Mails.
              INSERT INTO oc_appconfig (appid, configkey, configvalue)
              VALUES ('activity', 'default_setting_email', '0'),
                     ('activity', 'email_send_option', 'never')
              ON CONFLICT (appid, configkey)
              DO UPDATE SET configvalue = EXCLUDED.configvalue;

              -- Bestehende Nutzer-Opt-ins zuruecksetzen: ohne das gewinnt die
              -- gespeicherte Nutzereinstellung ueber den neuen Admin-Default.
              UPDATE oc_preferences
                 SET configvalue = '0'
               WHERE appid = 'activity'
                 AND configkey LIKE 'notify_email_%'
                 AND configvalue <> '0';

              -- T900001: Mail-App komplett deaktivieren — keine transaktionalen
              -- oder Benachrichtigungs-E-Mails mehr. Der Mail-Config-Receiver
              -- (mail_domain, mail_from_address etc.) bleibt bestehen, damit
              -- bei Reactivierung kein manueller Neuaufbau noetig ist.
              INSERT INTO oc_appconfig (appid, configkey, configvalue)
              VALUES ('mail', 'enabled', 'no')
              ON CONFLICT (appid, configkey)
              DO UPDATE SET configvalue = EXCLUDED.configvalue;
              SQL
              echo "Nextcloud notification mails disabled (activity + mail app)."
          env:
            - name: PGHOST
              value: nextcloud-db
            - name: PGDATABASE
              value: nextcloud
            - name: PGUSER
              value: nextcloud
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: workspace-secrets
                  key: NEXTCLOUD_DB_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
