# ═══════════════════════════════════════════════════════════════════
# Knowledge Ingestion CronJobs — embed PR history, markdown docs,
# and bug tickets into knowledge.chunks via local bge-m3 embeddings (T016562).
# Four schedules: prs (daily 2am), markdown (daily 2:30am),
# bugs (daily 3am), reindex-all (weekly Sunday 4am).
# ═══════════════════════════════════════════════════════════════════

# ── ConfigMap: knowledge ingestion scripts ────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: knowledge-scripts
  namespace: workspace
  labels:
    app: knowledge
data:
  lib-knowledge-pg.mjs: |
    import pg from 'pg';
    import { createHash } from 'node:crypto';

    const { Pool } = pg;

    export function makePool() {
      return new Pool({
        host:     process.env.PGHOST     ?? 'shared-db',
        port:     Number(process.env.PGPORT ?? 5432),
        database: process.env.PGDATABASE ?? 'website',
        user:     process.env.PGUSER     ?? 'website',
        password: process.env.PGPASSWORD,
      });
    }

    export function sha256(s) {
      return createHash('sha256').update(s).digest('hex');
    }

    export async function ensureCollection(pool, { name, source, brand = null, description = null }) {
      const r = await pool.query(
        `INSERT INTO knowledge.collections (name, source, brand, description)
         VALUES ($1, $2, $3, $4)
         ON CONFLICT (name) DO UPDATE SET description = COALESCE(EXCLUDED.description, knowledge.collections.description)
         RETURNING id`,
        [name, source, brand, description],
      );
      return r.rows[0].id;
    }

    export async function upsertDocumentAndChunks(pool, {
      collectionId, title, sourceUri, rawText, hash, metadata = {}, chunks,
    }) {
      const docRes = await pool.query(
        `INSERT INTO knowledge.documents (collection_id, title, source_uri, raw_text, sha256, metadata)
         VALUES ($1, $2, $3, $4, $5, $6::jsonb)
         ON CONFLICT (collection_id, source_uri) DO UPDATE
           SET title = EXCLUDED.title,
               raw_text = EXCLUDED.raw_text,
               sha256 = EXCLUDED.sha256,
               metadata = EXCLUDED.metadata
         RETURNING id, sha256`,
        [collectionId, title, sourceUri, rawText, hash, JSON.stringify(metadata)],
      );
      const docId = docRes.rows[0].id;
      const prevHash = docRes.rows[0].sha256;
      if (prevHash === hash && chunks === null) return { docId, reused: true };

      await pool.query('DELETE FROM knowledge.chunks WHERE document_id = $1', [docId]);
      for (const c of chunks) {
        await pool.query(
          `INSERT INTO knowledge.chunks (document_id, collection_id, position, text, embedding)
           VALUES ($1, $2, $3, $4, $5)`,
          [docId, collectionId, c.position, c.text, `[${c.embedding.join(',')}]`],
        );
      }
      return { docId, reused: false };
    }

    export async function bumpCollectionStats(pool, collectionId) {
      await pool.query(
        `UPDATE knowledge.collections
            SET chunk_count = (SELECT COUNT(*) FROM knowledge.chunks WHERE collection_id = $1),
                last_indexed_at = now()
          WHERE id = $1`,
        [collectionId],
      );
    }

    // T016562: Voyage entfernt — Einbettung immer ueber lokales bge-m3
    // (LLM_EMBED_URL, fail-closed).
    export async function embedAll(texts, batch = 128) {
      const bgeUrl = process.env.LLM_EMBED_URL;
      if (!bgeUrl) throw new Error('LLM_EMBED_URL nicht konfiguriert');
      const out = [];
      for (let i = 0; i < texts.length; i += batch) {
        const r = await fetch(`${bgeUrl}/v1/embeddings`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: 'bge-m3', input: texts.slice(i, i + batch) }),
        });
        if (!r.ok) throw new Error(`bge ${r.status} ${await r.text()}`);
        const j = await r.json();
        out.push(...j.data.map(d => d.embedding));
      }
      return out;
    }

    export function chunkPlain(text, target = 600, overlap = 100) {
      const charPerTok = 4;
      const targetChars  = target  * charPerTok;
      const overlapChars = overlap * charPerTok;
      if (text.length <= targetChars) return [{ position: 0, text }];
      const out = [];
      let pos = 0;
      let cursor = 0;
      while (cursor < text.length) {
        let end = Math.min(cursor + targetChars, text.length);
        if (end < text.length) {
          const slice = text.slice(end - 100, end);
          const idx = slice.lastIndexOf(' ');
          if (idx >= 0) end = end - 100 + idx;
        }
        out.push({ position: pos++, text: text.slice(cursor, end).trim() });
        if (end >= text.length) break;
        cursor = Math.max(end - overlapChars, cursor + 1);
      }
      return out;
    }

  ingest-prs.mjs: |
    import { makePool, sha256, ensureCollection, upsertDocumentAndChunks, bumpCollectionStats, embedAll, chunkPlain } from '/scripts/lib-knowledge-pg.mjs';

    const COLLECTION_NAME = 'PR History';
    const COLLECTION_SOURCE = 'pr_history';
    // T016563: nur PRs mit Link-Aktivitaet im Rueckblick-Fenster
    // (Default 30 Tage, via INGEST_LOOKBACK_DAYS konfigurierbar).
    const LOOKBACK_DAYS = Number(process.env.INGEST_LOOKBACK_DAYS ?? 30);

    async function main() {
      const pool = makePool();
      try {
        const collectionId = await ensureCollection(pool, {
          name: COLLECTION_NAME,
          source: COLLECTION_SOURCE,
          description: 'Merged pull requests (live source: tickets.ticket_links)',
        });

        const { rows } = await pool.query(
          `SELECT DISTINCT l.pr_number, t.title, t.description
             FROM tickets.ticket_links l
             JOIN tickets.tickets t ON t.id = l.from_id
            WHERE l.pr_number IS NOT NULL
              AND l.created_at > now() - ($1 || ' days')::interval
            ORDER BY l.pr_number DESC`,
          [LOOKBACK_DAYS],
        );

        if (rows.length === 0) {
          // [T002605] Zero-Item-Guard: leere Quelle ist verdaechtig, wenn der
          // Live-Store befuellt ist (die Legacy-Quelle ist leer — die
          // Quelle ist tickets.ticket_links).
          const { rows: live } = await pool.query(
            `SELECT COUNT(DISTINCT pr_number) AS n FROM tickets.ticket_links WHERE pr_number IS NOT NULL`,
          );
          const liveCount = Number(live[0]?.n ?? 0);
          if (liveCount > 0) {
            console.error(`0 PRs, but live store has ${liveCount} — source misconfiguration?`);
            process.exit(1);
          }
          console.log('0 PRs (live store empty — nothing to ingest)');
        }

        console.log(`Found ${rows.length} PRs to ingest`);

        for (const row of rows) {
          const text = [
            `PR #${row.pr_number}: ${row.title}`,
            row.description ?? '',
          ].filter(Boolean).join('\n\n');

          const hash = sha256(text);
          const sourceUri = `pr:${row.pr_number}`;
          const chunks = chunkPlain(text).map(c => ({ ...c, embedding: null }));

          const embeddings = await embedAll(chunks.map(c => c.text));
          const chunksWithEmbed = chunks.map((c, i) => ({ ...c, embedding: embeddings[i] }));

          await upsertDocumentAndChunks(pool, {
            collectionId,
            title: `PR #${row.pr_number}: ${row.title}`,
            sourceUri,
            rawText: text,
            hash,
            metadata: {
              pr_number: row.pr_number,
            },
            chunks: chunksWithEmbed,
          });
          process.stdout.write('.');
        }

        console.log('\nBumping collection stats...');
        await bumpCollectionStats(pool, collectionId);
        console.log('Done.');
      } finally {
        await pool.end();
      }
    }

    main().catch(err => { console.error(err); process.exit(1); });

  ingest-markdown.mjs: |
    // [T002605] Suspended: Markdown-Ingest laeuft bewusst lokal-only —
    // task knowledge:reindex SOURCE=markdown (Repo-Mount noetig).
    // Markdown ingestion requires the repository to be mounted at /repo.
    // In-cluster CronJob pods do not have repo access — skipping.
    // Trigger manually via: task knowledge:reindex SOURCE=markdown
    console.log('Markdown ingestion requires repo mount — skipping in cluster.');
    console.log('Run locally: task knowledge:reindex SOURCE=markdown');

  ingest-bug-tickets.mjs: |
    import { makePool, sha256, ensureCollection, upsertDocumentAndChunks, bumpCollectionStats, embedAll, chunkPlain } from '/scripts/lib-knowledge-pg.mjs';

    const COLLECTION_NAME = 'Bug Tickets';
    const COLLECTION_SOURCE = 'bug_tickets';
    const BRAND = process.env.BRAND ?? 'mentolder';
    // T016563: offene Tickets immer, erledigte nur im Rueckblick-Fenster
    // (Default 30 Tage, via INGEST_LOOKBACK_DAYS konfigurierbar).
    const LOOKBACK_DAYS = Number(process.env.INGEST_LOOKBACK_DAYS ?? 30);

    async function main() {
      const pool = makePool();
      try {
        const collectionId = await ensureCollection(pool, {
          name: COLLECTION_NAME,
          source: COLLECTION_SOURCE,
          brand: BRAND,
          description: `Bug tickets for brand: ${BRAND}`,
        });

        const { rows } = await pool.query(
          `SELECT t.external_id AS ticket_id, t.title, t.description, t.status, t.brand, t.created_at,
                  (SELECT l.pr_number FROM tickets.ticket_links l
                    WHERE l.from_id = t.id AND l.kind = 'fixes' AND l.pr_number IS NOT NULL
                    ORDER BY l.created_at DESC LIMIT 1) AS fixed_in_pr
             FROM tickets.tickets t
            WHERE t.brand = $1 AND t.type IN ('bug','fix')
              AND (t.status NOT IN ('done','archived')
                   OR (t.status = 'done'
                       AND t.updated_at > now() - ($2 || ' days')::interval))
            ORDER BY t.created_at DESC`,
          [BRAND, LOOKBACK_DAYS],
        );

        if (rows.length === 0) {
          // [T002605] Zero-Item-Guard: leere Quelle ist verdaechtig, wenn der
          // Live-Store befuellt ist (die Legacy-Quelle ist leer — die Quelle
          // ist tickets.tickets).
          const { rows: live } = await pool.query(
            `SELECT COUNT(*) AS n FROM tickets.tickets WHERE brand = $1 AND type IN ('bug','fix')`,
            [BRAND],
          );
          const liveCount = Number(live[0]?.n ?? 0);
          if (liveCount > 0) {
            console.error(`0 bug tickets, but live store has ${liveCount} — source misconfiguration?`);
            process.exit(1);
          }
          console.log('0 bug tickets (live store empty — nothing to ingest)');
        }

        console.log(`Found ${rows.length} bug tickets for brand "${BRAND}"`);

        for (const row of rows) {
          const text = [
            `${row.ticket_id}: ${row.title}`,
            `Status: ${row.status}`,
            row.fixed_in_pr ? `Fixed in PR #${row.fixed_in_pr}` : '',
            row.description ?? '',
          ].filter(Boolean).join('\n\n');

          const hash = sha256(text);
          const sourceUri = `bug:${row.ticket_id}`;
          const rawChunks = chunkPlain(text);
          const embeddings = await embedAll(rawChunks.map(c => c.text));
          const chunks = rawChunks.map((c, i) => ({ ...c, embedding: embeddings[i] }));

          await upsertDocumentAndChunks(pool, {
            collectionId,
            title: `${row.ticket_id}: ${row.title}`,
            sourceUri,
            rawText: text,
            hash,
            metadata: {
              ticket_id: row.ticket_id,
              status: row.status,
              brand: row.brand,
              fixed_in_pr: row.fixed_in_pr,
              created_at: row.created_at,
            },
            chunks,
          });
          process.stdout.write('.');
        }

        console.log('\nBumping collection stats...');
        await bumpCollectionStats(pool, collectionId);
        console.log('Done.');
      } finally {
        await pool.end();
      }
    }

    main().catch(err => { console.error(err); process.exit(1); });

---

# ── CronJob: ingest PR history (daily 02:00 UTC) ──────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: knowledge-ingest-prs
  namespace: workspace
  labels:
    app: knowledge
spec:
  schedule: "0 2 * * *"
  # Retiriert 2026-10-14: ingest-prs.mjs liest tickets.ticket_links (Schema dropped
  # auf fleet + devmesh). Suspendiert wie knowledge-ingest-markdown.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: npm-install
              image: node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
              imagePullPolicy: IfNotPresent
              command: [sh, -c, "npm install pg --no-package-lock --silent --prefix /tmp && cp -r /tmp/node_modules/* /scripts/node_modules/"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: node-modules
                  mountPath: /scripts/node_modules
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
          containers:
            - name: ingest
              image: node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
              imagePullPolicy: IfNotPresent
              command: [node, /scripts/ingest-prs.mjs]
              env:
                - name: PGHOST
                  value: "shared-db"
                - name: PGDATABASE
                  value: "website"
                - name: PGUSER
                  value: "website"
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: workspace-secrets
                      key: WEBSITE_DB_PASSWORD
                - name: LLM_EMBED_URL
                  value: "http://llm-gateway-embed.workspace.svc.cluster.local:8081"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: node-modules
                  mountPath: /scripts/node_modules
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: scripts
              configMap:
                name: knowledge-scripts
            - name: node-modules
              emptyDir: {}
---

