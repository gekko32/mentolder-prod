apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# [T900107] Deployment und Service des claude-code-mcp-monolith sind entfernt —
# den Dienst bedient jetzt k3d/dev-pod (Namespace workspace-dev, ausgeliefert
# ueber prod-fleet/dev-pod und flux/clusters/fleet/ks-dev-pod.yaml).
#
# Was hier bleibt, ist die RBAC des ServiceAccounts claude-code-agent. Sie wird
# nicht mit entfernt, weil sie ausserhalb des Monolithen referenziert wird
# (prod-fleet/platform/claude-code-agent-rbac.yaml); ihr Abbau ist ein eigener
# Vorgang und nicht Teil dieses Changes.
resources:
  - claude-code-agent-sa.yaml
  - claude-code-agent-clusterrole.yaml
  - claude-code-agent-role.yaml
  - claude-code-agent-rolebinding.yaml

labels:
  - pairs:
      app: claude-code-agent
      managed-by: kustomize
    includeSelectors: false
