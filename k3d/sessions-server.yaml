# Sessions Server — statischer nginx für session-<slug>.${SESSIONS_DOMAIN}
# (Domain aus der zentralen Konfiguration, T016251).
# Dateien landen via kubectl cp in /srv/sessions/<slug>/index.html.
# IngressRoute + Certificate nur im prod-fleet/mentolder/ Overlay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sessions-server-nginx
  namespace: workspace
data:
  # Main-Konfiguration fuer non-root-Betrieb (SA-GR-06): pid und alle
  # temp-Pfade nach /tmp, Logs nach stdout/stderr. Das Image-Default
  # schreibt nach root-owned Pfaden und ist fuer uid 101 unbrauchbar.
  nginx.conf: |
    worker_processes  1;
    pid               /tmp/nginx.pid;
    error_log         /dev/stderr notice;
    events { worker_connections  1024; }
    http {
        include        /etc/nginx/mime.types;
        default_type   application/octet-stream;
        access_log     /dev/stdout;
        client_body_temp_path  /tmp/client_temp;
        proxy_temp_path        /tmp/proxy_temp;
        fastcgi_temp_path      /tmp/fastcgi_temp;
        uwsgi_temp_path        /tmp/uwsgi_temp;
        scgi_temp_path         /tmp/scgi_temp;
        include /etc/nginx/conf.d/*.conf;
    }
  default.conf: |
    # T016251: Die Domain kommt aus der zentralen Konfiguration — der
    # ${SESSIONS_DOMAIN}-Platzhalter wird beim Deploy substituiert (Dev:
    # envsubst-Liste im workspace:setup-Task, Prod: flux-render-artifact.sh
    # extrahiert ${VAR}-Referenzen automatisch; Wert aus environments/*.yaml).
    server {
        listen 8080;
        server_name ~^session-(?<slug>[a-z0-9-]+)\.${SESSIONS_DOMAIN}$;
        root /srv/sessions/$slug;
        index index.html;
        try_files $uri /index.html =404;
        add_header X-Session-Slug $slug always;
    }
    server {
        listen 8080 default_server;
        # T015167: return ist eine Rewrite-Phasen-Direktive — auf Server-Level
        # feuert sie VOR dem Location-Matching und wuerde /health mit 404
        # abschiessen. Deshalb die 404er als Location statt server-level.
        # T016251: Content-Type via default_type statt add_header — add_header
        # DUPLIZIERT den Header, nginx setzt ihn bereits aus default_type.
        default_type text/plain;
        location = /health {
            return 200 "ok\n";
        }
        location / {
            return 404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sessions-server
  namespace: workspace
  labels:
    app: sessions-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sessions-server
  template:
    metadata:
      labels:
        app: sessions-server
    spec:
      # Non-Root (SA-GR-06): uid/gid 101 = nginx-user im alpine-Image.
      # fsGroup macht die emptyDirs group-writable, damit der kubectl-cp-
      # Pfad nach /srv/sessions als non-root weiterfunktioniert.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.31.6-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-main-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: sessions
              mountPath: /srv/sessions
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: nginx-conf
          configMap:
            name: sessions-server-nginx
            # T015167: items-Filter — ohne ihn landet der nginx.conf-Key mit im
            # conf.d-Include-Verzeichnis und nginx bricht mit "[emerg]
            # worker_processes directive is not allowed here" ab.
            items:
              - key: default.conf
                path: default.conf
        - name: nginx-main-conf
          configMap:
            name: sessions-server-nginx
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: sessions
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sessions-server
  namespace: workspace
  labels:
    app: sessions-server
spec:
  selector:
    app: sessions-server
  ports:
    - port: 80
      targetPort: 8080
