apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-grafana
  namespace: monitoring
spec:
  template:
    spec:
      containers:
        - name: grafana-sc-dashboard
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits:   { cpu: 100m, memory: 128Mi }
        - name: grafana-sc-datasources
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits:   { cpu: 100m, memory: 128Mi }
      # T901100: Init-Container init-chown-data (busybox) braucht resources.requests & limits,
      # um Sentinel-Findings (BestEffort QoS) in k3d und prod-fleet (mentolder/korczewski) zu beheben.
      initContainers:
        - name: init-chown-data
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }

