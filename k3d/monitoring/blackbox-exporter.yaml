apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: blackbox-exporter }
  template:
    metadata:
      labels: { app: blackbox-exporter }
    spec:
      securityContext:
        runAsNonRoot: true
        # Ohne runAsUser lehnt das Kubelet den Container ab: das Image
        # deklariert root als USER, runAsNonRoot verbietet das
        # ("container has runAsNonRoot and image will run as root") - der Pod
        # stand 11 Tage in CreateContainerConfigError, damit lief kein
        # Blackbox-Probe mehr. 65534 = nobody, wie in prod/reflector.yaml. [T900034]
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.27.0@sha256:a50c4c0eda297baa1678cd4dc4712a67fdea713b832d43ce7fcc5f9bea05094d
          args: ["--config.file=/etc/blackbox/config.yml"]
          ports: [{ name: http, containerPort: 9115 }]
          readinessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts: [{ name: config, mountPath: /etc/blackbox }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
      volumes:
        - name: config
          configMap: { name: blackbox-exporter }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter
  namespace: monitoring
data:
  config.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          method: GET
          valid_status_codes: [200]
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  selector: { app: blackbox-exporter }
  ports: [{ name: http, port: 9115, targetPort: http }]
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: brand-public-health
  namespace: monitoring
  labels: { release: monitoring }
spec:
  jobName: brand-public-health
  interval: 5m
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - https://web.mentolder.de/api/health
        # Public production Ingress hosts.  Keep this list in sync with the
        # production Ingress manifests; G-SVC01 validates the coverage.
        # design.mentolder.de entfernt (29.10.2026): seit dem Neuaufbau ohne Dienst (404).
        - https://studio.mentolder.de
        # Geralds Dienste (29.10.2026, Dashboard „mentolder auf einen Blick“)
        - https://files.mentolder.de/status.php
        - https://auth.mentolder.de/.well-known/openid-configuration
        - https://office.mentolder.de/hosting/discovery
        - https://brett.mentolder.de/
        - https://funk.mentolder.de/
        - https://vault.mentolder.de/alive
        - https://signaling.mentolder.de/api/v1/welcome
        - https://grafana.mentolder.de/api/health
      relabelingConfigs:
        - sourceLabels: [__param_target]
          regex: https://web\.mentolder\.de/.*
          targetLabel: brand
          replacement: mentolder
        - sourceLabels: [__param_target]
          regex: https://web\.korczewski\.de/.*
          targetLabel: brand
          replacement: korczewski
