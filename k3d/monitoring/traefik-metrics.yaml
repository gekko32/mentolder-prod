# k3s-native HelmChartConfig that re-renders the built-in Traefik chart with
# Prometheus metrics enabled on a dedicated `metrics` entrypoint (port 9101).
# Stays in kube-system (where k3s manages Traefik) — NOT rewritten by the
# monitoring kustomization's namespace transformer because the namespace is
# explicit here.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |
    # Access logs must live on the kube-system HelmChartConfig: k3d/ has a
    # namespace transformer, so a HelmChartConfig placed in that base renders
    # into each workspace namespace and is ignored by the k3s-managed Traefik
    # chart. Keep only failed requests to make authentication/rate-limit
    # incidents attributable without logging normal user traffic.
    additionalArguments:
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.filters.statuscodes=400-599"
      - "--accesslog.fields.defaultmode=keep"
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--accesslog.fields.headers.names.X-Request-ID=keep"
    metrics:
      prometheus:
        entryPoint: metrics
        addRoutersLabels: true
    ports:
      metrics:
        port: 9101
        expose:
          default: false
        exposedPort: 9101
        protocol: TCP
