apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: workspace-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  # 29.10.2026 (Gerald): Warn-Mails wieder an, an info@mentolder.de (mailbox.org).
  # Nur warning/critical; Watchdog und InfoInhibitor (Dauersignale) gehen nirgends hin.
  route:
    groupBy: [alertname, namespace]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    receiver: keine-mail
    routes:
      - receiver: operator-email
        matchers:
          - name: alertname
            matchType: "!~"
            value: "Watchdog|InfoInhibitor"
          - name: severity
            matchType: "=~"
            value: "warning|critical"
  receivers:
    - name: keine-mail
    - name: operator-email
      emailConfigs:
        - sendResolved: true
          to: info@mentolder.de
          from: info@mentolder.de
          smarthost: ${SMTP_HOST}:${SMTP_PORT}
          authUsername: info@mentolder.de
          authPassword:
            name: alertmanager-smtp
            key: SMTP_PASSWORD
          requireTLS: true
# Pushover-Routing bewusst entfernt [T014542]: PUSHOVER_USER/PUSHOVER_TOKEN waren
# nie gesetzt (environments/*.yaml führen "" seit #1552), das SealedSecret
# entschlüsselt zu leeren Werten — der Prometheus Operator verwirft deshalb die
# komplette AlertmanagerConfig ("mandatory field userKey is empty") und legt damit
# auch das E-Mail-Routing lahm. Wiedereinführung NUR mit nicht-leeren Credentials:
# neues alertmanager-pushover-SealedSecret + pushoverConfigs-Receiver + critical-Route.
# (Toter Secret-Template-Rest entfernt [T016575].)
