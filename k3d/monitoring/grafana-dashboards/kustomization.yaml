apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

configMapGenerator:
  - name: grafana-dashboard-kubernetes-overview
    files:
      - kubernetes-overview.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-traefik
    files:
      - traefik-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-log-explorer
    files:
      - log-explorer.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-api-errors
    files:
      - api-errors.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-traefik-access
    files:
      - traefik-access.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-keycloak-audit
    files:
      - keycloak-audit.json
    options:
      labels:
        grafana_dashboard: "1"

generatorOptions:
  disableNameSuffixHash: true
